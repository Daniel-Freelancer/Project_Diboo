name: Blender Render Diagnostic

on:
  workflow_dispatch:

jobs:
  blender-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg

      - name: Create Blender test script
        run: |
          cat > test.py <<'PY'
          import bpy
          import math

          # Clear scene
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          scene = bpy.context.scene

          # Vertical test resolution
          scene.render.resolution_x = 540
          scene.render.resolution_y = 960
          scene.render.resolution_percentage = 100

          # One frame only
          scene.frame_set(1)

          # Eevee
          scene.render.engine = 'BLENDER_EEVEE_NEXT'

          # PNG output
          scene.render.image_settings.file_format = 'PNG'

          # World
          world = bpy.data.worlds.new("TestWorld")
          scene.world = world
          world.color = (0.08, 0.08, 0.08)

          # Ground
          bpy.ops.mesh.primitive_plane_add(
              size=20,
              location=(0, 0, 0)
          )

          # Ball
          bpy.ops.mesh.primitive_uv_sphere_add(
              segments=32,
              ring_count=16,
              location=(0, 0, 1)
          )

          ball = bpy.context.object
          bpy.ops.object.shade_smooth()

          # Camera
          bpy.ops.object.camera_add(
              location=(0, -8, 4)
          )

          camera = bpy.context.object
          scene.camera = camera

          direction = ball.location - camera.location
          camera.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          # Light
          bpy.ops.object.light_add(
              type='AREA',
              location=(0, -3, 6)
          )

          light = bpy.context.object
          light.data.energy = 1200
          light.data.shape = 'DISK'
          light.data.size = 5

          direction = ball.location - light.location
          light.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          print("TEST SCENE CREATED")
          print("Resolution:", scene.render.resolution_x, "x", scene.render.resolution_y)
          print("Frame:", scene.frame_current)
          print("Engine:", scene.render.engine)
          PY

      - name: Create output directory
        run: |
          mkdir -p /tmp/benchmark

      - name: Render ONE frame
        run: |
          blender \
            -b \
            --python test.py \
            -o /tmp/benchmark/test_ \
            -F PNG \
            -f 1

      - name: Check output
        run: |
          echo "================================"
          echo "OUTPUT CHECK"
          echo "================================"

          echo ""
          echo "Files produced:"
          find /tmp/benchmark -maxdepth 1 -type f -printf '%f\n' | sort

          echo ""
          echo "File count:"
          find /tmp/benchmark -maxdepth 1 -type f | wc -l

          echo ""
          echo "Directory:"
          ls -lah /tmp/benchmark

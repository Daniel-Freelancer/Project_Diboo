    steps:
      - name: Show system information
        run: |
          echo "================================"
          echo "DIBOO CLOUD RUNNER TEST"
          echo "================================"
          echo ""
          echo "CPU:"
          nproc
          echo ""
          echo "RAM:"
          free -h
          echo ""

name: Blender Render Diagnostic

on:
  workflow_dispatch:

jobs:
  blender-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Restore tool cache
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/diboo-tools
          key: diboo-tools-blender-4.0.2-ffmpeg-6.1.1-v2

      - name: Install tools if cache is missing
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -e

          mkdir -p ~/diboo-tools

          echo "Installing Blender and FFmpeg..."

          sudo apt-get update

          sudo apt-get install -y \
            blender \
            ffmpeg \
            libegl1 \
            libgl1

          mkdir -p ~/diboo-tools/bin

          cp /usr/bin/blender ~/diboo-tools/bin/blender
          cp /usr/bin/ffmpeg ~/diboo-tools/bin/ffmpeg
          cp /usr/bin/ffprobe ~/diboo-tools/bin/ffprobe

          echo "Tools copied to cache."

      - name: Restore tools to PATH
        run: |
          set -e

          mkdir -p "$HOME/diboo-tools/bin"

          echo "$HOME/diboo-tools/bin" >> "$GITHUB_PATH"

          echo "===== TOOL PATH ====="
          echo "$HOME/diboo-tools/bin"

      - name: Check Blender
        run: |
          echo "===== BLENDER ====="
          blender --version

      - name: Check FFmpeg
        run: |
          echo "===== FFMPEG ====="
          ffmpeg -version | head -n 3

      - name: Check FFprobe
        run: |
          echo "===== FFPROBE ====="
          ffprobe -version | head -n 3

      - name: Create Blender test script
        run: |
          cat > test.py <<'PY'
          import bpy

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          scene = bpy.context.scene

          scene.render.resolution_x = 540
          scene.render.resolution_y = 960
          scene.render.resolution_percentage = 100

          scene.frame_set(1)

          scene.render.engine = 'BLENDER_EEVEE'
          scene.render.image_settings.file_format = 'PNG'

          world = bpy.data.worlds.new("TestWorld")
          scene.world = world
          world.color = (0.08, 0.08, 0.08)

          bpy.ops.mesh.primitive_plane_add(
              size=20,
              location=(0, 0, 0)
          )

          bpy.ops.mesh.primitive_uv_sphere_add(
              segments=32,
              ring_count=16,
              location=(0, 0, 1)
          )

          ball = bpy.context.object

          bpy.ops.object.shade_smooth()

          bpy.ops.object.camera_add(
              location=(0, -8, 4)
          )

          camera = bpy.context.object
          scene.camera = camera

          direction = ball.location - camera.location
          camera.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          bpy.ops.object.light_add(
              type='AREA',
              location=(0, -3, 6)
          )

          light = bpy.context.object

          light.data.energy = 1200
          light.data.shape = 'DISK'
          light.data.size = 5

          direction = ball.location - light.location
          light.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          print("TEST SCENE CREATED")
          print("Resolution:", scene.render.resolution_x, "x", scene.render.resolution_y)
          print("Frame:", scene.frame_current)
          print("Engine:", scene.render.engine)
          PY

      - name: Create output directory
        run: |
          mkdir -p /tmp/benchmark

      - name: Render ONE frame
        run: |
          blender \
            -b \
            --python test.py \
            -o /tmp/benchmark/test_ \
            -F PNG \
            -f 1

      - name: Check output
        run: |
          echo "================================"
          echo "OUTPUT CHECK"
          echo "================================"

          echo ""
          echo "Files produced:"
          find /tmp/benchmark -maxdepth 1 -type f -printf '%f\n' | sort

          echo ""
          echo "File count:"
          find /tmp/benchmark -maxdepth 1 -type f | wc -l

          echo ""
          echo "Directory:"
          ls -lah /tmp/benchmark

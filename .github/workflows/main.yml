name: Install Blender and FFmpeg

on:
  workflow_dispatch:

jobs:
  install-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Update package list
        run: |
          sudo apt-get update

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get install -y blender ffmpeg

      - name: Check Blender
        run: |
          echo "===== BLENDER ====="
          blender --version
          echo "Blender installation: OK"

      - name: Check FFmpeg
        run: |
          echo "===== FFMPEG ====="
          ffmpeg -version | head -n 3
          echo "FFmpeg installation: OK"

      - name: Check final resources
        run: |
          echo "===== CPU ====="
          nproc
          echo ""

          echo "===== MEMORY ====="
          free -h
          echo ""

          echo "===== DISK ====="
          df -h /
          echo ""

          echo "================================"
          echo "INSTALLATION TEST FINISHED"
          echo "================================"

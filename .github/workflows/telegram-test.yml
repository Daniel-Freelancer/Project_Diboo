name: Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO TELEGRAM TEST"
          echo "================================"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=PROJECT_DIBOO Telegram connection: PASSED")

          echo ""
          echo "Telegram response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"ok":true'

          echo ""
          echo "================================"
          echo "PROJECT_DIBOO TELEGRAM TEST: PASSED"
          echo "================================"

name: Project_Diboo_Final

on:
  # Uruguay UTC-3:
  # 00:00 Uruguay = 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:

  generate-video:

    name: Project_Diboo Video ${{ matrix.video_number }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 10

      matrix:
        video_number:
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"

    env:
      VIDEO_NUMBER: ${{ matrix.video_number }}

    steps:

      # ============================================================
      # 1. BASIC SETUP
      # ============================================================

      - name: Initialize Project_Diboo
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PROJECT_DIBOO"
          echo "VIDEO $VIDEO_NUMBER / 10"
          echo "========================================"

          mkdir -p blender_scene
          mkdir -p logs
          mkdir -p output

          echo "VIDEO_NUMBER=$VIDEO_NUMBER"

          date -u

          echo ""
          echo "Runner:"
          uname -a


      # ============================================================
      # 2. INSTALL BLENDER + FFMPEG
      # ============================================================

      - name: Prepare Blender and FFmpeg
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DIBOO TOOL PREPARATION"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            blender \
            ffmpeg \
            libtbb12 \
            libegl1 \
            libgl1 \
            libglib2.0-0

          echo ""
          echo "BLENDER:"
          blender --version | head -n 1

          echo ""
          echo "FFMPEG:"
          ffmpeg -version | head -n 1

          echo ""
          echo "DIBOO TOOLS READY"


      # ============================================================
      # 3. GENERATE STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate Project_Diboo story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PROJECT_DIBOO STORY GENERATION"
          echo "VIDEO $VIDEO_NUMBER / 10"
          echo "========================================"

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the complete visual story, editing-plan and Blender procedural generation engine for Project_Diboo, an original animated short-form channel. Generate BOTH a complete structured production package and a complete Blender Python script in ONE response. The final result is an original animated YouTube Short / TikTok Short designed primarily through VISUAL STORYTELLING. There must be NO spoken narration, NO voice-over and NO subtitles. The viewer must understand the story from the animation itself, character actions, expressions, staging, camera work, visual cause-and-effect and sound design. The final video must feel like an actual animated short, NOT a collection of primitive 3D objects, NOT cardboard, NOT a basic Blender test, NOT a technical visualization and NOT an educational 3D demo. Use expressive characters, readable silhouettes, appealing proportions, strong posing, emotional beats, visual comedy or emotion, cinematic framing, deliberate camera movement, continuity between shots and a strong beginning-middle-ending structure. Do not imitate or copy any existing copyrighted animation, character, franchise or protected visual style. The visual language must remain original. Create a new original story for this generation. TARGET approximately 50 seconds and remain between 40 and 60 seconds. Use English only for metadata and scene descriptions. Use 24 FPS and vertical 1080x1920 composition. RETURN ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly these fields: title, description, hashtags, duration_target, language, hook, visual_theme, music, scenes. duration_target MUST be a plain integer between 40 and 60. language MUST be en. hook MUST be a non-empty string describing the opening visual hook. visual_theme MUST be a non-empty object containing style, palette, lighting, animation and camera. music MUST be a non-empty object containing style, mood, intensity, instrumentation and timing. scenes MUST be a non-empty list. EVERY scene MUST contain: duration, description, camera, action, emotion, visual_transition, sfx, music. Scene duration MUST be a plain positive integer. The total scene duration should approximately equal duration_target. Do NOT create narration fields. Do NOT create subtitle fields. Do NOT create voice fields. The entire story must be understandable without dialogue or text. Characters must communicate through body language, facial expressions, eye direction, movement, timing and staging. Each scene should have a clear visual purpose. The opening scene must immediately establish a strong visual hook. The middle must escalate the situation or reveal new information. The final scenes must provide a clear payoff. Avoid random disconnected events. Maintain character identity, environment continuity and object continuity between scenes. The description must be suitable for the YouTube/TikTok post. Hashtags must be a list of relevant hashtags. Music must describe an original royalty-free ambient score that changes according to the emotional circumstance of the scene. Music must never depend on external music files. SFX must describe simple effects that can later be synthesized procedurally. The Blender script MUST be a complete standalone Python script for Blender 4.0.2. The script MUST be conservative, deterministic and reliable. It MUST NOT depend on external files, addons, downloads, textures, fonts, images, sounds or network access. It MUST run correctly in Blender 4.0.2 background mode using blender -b --python blender_scene.py. The script MUST import bpy and math only unless another Python standard-library module is absolutely necessary. It MUST first clear the default scene using bpy.ops.object.select_all(action='SELECT') and bpy.ops.object.delete(use_global=False). Use stable Blender 4.0.2 operators. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. Use cubes, spheres, cylinders, cones and planes only. Create materials using bpy.data.materials.new and diffuse_color whenever possible. If using nodes, NEVER access Principled BSDF inputs by numeric indexes. NEVER use inputs[21], inputs[20], inputs[0] or any numeric socket index. Access sockets only by name. Color values MUST be 4-value RGBA tuples. Float values MUST be single floats. Create the camera BEFORE creating animation. Set scene.camera = camera. Create at least one light. Use scene.render.engine = 'BLENDER_EEVEE' exactly. NEVER use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100 and 24 FPS. Convert duration_target to frames. Set scene.frame_start = 1 and scene.frame_end = duration_target * scene.render.fps. Keep geometry and lighting simple enough for fast EEVEE rendering but prioritize appealing animated silhouettes and visual readability. Avoid simulations, particle systems, geometry nodes, compositing, volumetrics, cloth, smoke, fire, rigid body simulations and expensive modifiers. Prefer simple keyframe animation. Every animated object must already exist before keyframes are inserted. Use strong vertical composition. Keep important characters and actions inside the central safe area. Use deliberate close-ups, medium shots and wider establishing shots rather than one static camera for the entire video. Use camera movement when it improves storytelling. Characters should have readable poses and expressive animation. Avoid characters that look like rigid mannequins. Use simple facial features and body parts where practical. Avoid excessive geometric detail that slows rendering. The goal is appealing animated storytelling, not photorealism. Do NOT generate audio inside Blender. Do NOT depend on external audio files. Before saving, verify that scene.camera is not None. The script MUST save the Blender scene using bpy.ops.wm.save_as_mainfile(filepath='/tmp/diboo_story_scene.blend'). After saving, verify that the file exists using Python standard library os.path.exists. At the end print exactly these diagnostic messages: DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION, BLENDER SCENE READY. The script must not render anything itself. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI ATTEMPT $ATTEMPT / 5 ====="

            set +e

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            CURL_EXIT=$?

            set -e

            echo "$RESPONSE" > gemini_response.json

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "Gemini HTTP request failed."

              if echo "$RESPONSE" | grep -qE \
                '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'
              then
                echo "Gemini temporarily unavailable."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE \
                '"code": ?429|too_many_requests|Rate limit exceeded'
              then
                echo "Gemini rate limit reached."
                sleep 60
                continue
              fi

              cat gemini_response.json
              exit 1
            fi

            if echo "$RESPONSE" | grep -q '"error"'; then
              echo "===== GEMINI API ERROR ====="
              cat gemini_response.json
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "===== GEMINI FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo ""
          echo "===== GEMINI RESPONSE RECEIVED ====="


      # ============================================================
      # 4. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract Project_Diboo files
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):
              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):
                  if content.get("type") == "text":
                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini response did not contain model output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          generated = json.loads(output_text)

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(story, dict):
              raise RuntimeError(
                  "story must be an object."
              )

          if not isinstance(blender_script, str):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[
                  len("```python"):
              ]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = blender_script.rstrip()[:-3]

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")
          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print(
              "blender_scene/blender_scene.py"
          )

          print("")
          print("Script size:")
          print(
              len(blender_script),
              "characters"
          )
          PY


      # ============================================================
      # 5. VALIDATE STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          required_fields = [
              "title",
              "description",
              "hashtags",
              "duration_target",
              "language",
              "hook",
              "visual_theme",
              "music",
              "scenes"
          ]

          for field in required_fields:
              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if not isinstance(story["title"], str):
              raise RuntimeError(
                  "title must be a string."
              )

          if not story["title"].strip():
              raise RuntimeError(
                  "title cannot be empty."
              )

          if str(story["language"]).lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          duration_value = story["duration_target"]

          if isinstance(duration_value, bool):
              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          if isinstance(duration_value, int):
              duration = duration_value

          elif isinstance(duration_value, float):
              duration = int(duration_value)

          elif isinstance(duration_value, str):
              match = re.search(
                  r"\d+",
                  duration_value
              )

              if not match:
                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(match.group(0))

          else:
              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          if not 40 <= duration <= 60:
              raise RuntimeError(
                  f"Invalid duration: {duration}. "
                  "Must be between 40 and 60 seconds."
              )

          story["duration_target"] = duration

          if not isinstance(
              story["hashtags"],
              list
          ) or not story["hashtags"]:
              raise RuntimeError(
                  "hashtags must be a non-empty list."
              )

          if not isinstance(
              story["visual_theme"],
              dict
          ):
              raise RuntimeError(
                  "visual_theme must be an object."
              )

          for field in [
              "style",
              "palette",
              "lighting",
              "animation",
              "camera"
          ]:
              if field not in story["visual_theme"]:
                  raise RuntimeError(
                      f"visual_theme missing: {field}"
                  )

          if not isinstance(
              story["music"],
              dict
          ):
              raise RuntimeError(
                  "music must be an object."
              )

          for field in [
              "style",
              "mood",
              "intensity",
              "instrumentation",
              "timing"
          ]:
              if field not in story["music"]:
                  raise RuntimeError(
                      f"music missing: {field}"
                  )

          scenes = story["scenes"]

          if not isinstance(
              scenes,
              list
          ) or not scenes:
              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "emotion",
              "visual_transition",
              "sfx",
              "music"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(scene, dict):
                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:
                  if field not in scene:
                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw = scene["duration"]

              if isinstance(raw, bool):
                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              if isinstance(raw, str):
                  match = re.search(
                      r"\d+",
                      raw
                  )

                  if not match:
                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(raw, (int, float)):
                  scene_duration = int(raw)

              else:
                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:
                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration
              total_scene_duration += scene_duration

          if abs(
              total_scene_duration - duration
          ) > 5:
              raise RuntimeError(
                  f"Total scene duration "
                  f"({total_scene_duration}s) differs too much "
                  f"from target ({duration}s)."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "/tmp/diboo_duration.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(str(duration))

          print("")
          print("========================================")
          print("PROJECT_DIBOO STORY VALIDATION: PASSED")
          print("========================================")
          print("TITLE:", story["title"])
          print("DURATION:", duration)
          print("SCENES:", len(scenes))
          print(
              "TOTAL SCENE DURATION:",
              total_scene_duration
          )
          PY


      # ============================================================
      # 6. VALIDATE BLENDER PYTHON
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -euo pipefail

          test -s \
            blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax: PASSED"

          ls -lh \
            blender_scene/blender_scene.py


      # ============================================================
      # 7. GENERATE BLENDER SCENE + AUTO REPAIR
      # ============================================================

      - name: Generate Blender scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "VIDEO $VIDEO_NUMBER"
          echo "========================================"

          rm -f \
            /tmp/diboo_story_scene.blend \
            blender_scene/blender_scene_error.log

          MAX_REPAIRS=3
          REPAIR=0

          while true
          do

            echo ""
            echo "========================================"
            echo "BLENDER GENERATION ATTEMPT"
            echo "$((REPAIR + 1))"
            echo "========================================"

            rm -f \
              /tmp/diboo_story_scene.blend

            set +e

            blender \
              -b \
              --python blender_scene/blender_scene.py \
              > blender_scene/blender_run.log 2>&1

            BLENDER_EXIT=$?

            set -e

            echo ""
            echo "BLENDER EXIT CODE:"
            echo "$BLENDER_EXIT"

            if [ "$BLENDER_EXIT" -eq 0 ] && \
               [ -s /tmp/diboo_story_scene.blend ]; then

              echo ""
              echo "DIBOO BLENDER SCENE READY"

              ls -lh \
                /tmp/diboo_story_scene.blend

              break
            fi

            echo ""
            echo "BLENDER SCENE GENERATION FAILED"

            tail -n 150 \
              blender_scene/blender_run.log \
              || true

            cp \
              blender_scene/blender_run.log \
              blender_scene/blender_scene_error.log

            if [ "$REPAIR" -ge "$MAX_REPAIRS" ]; then
              echo ""
              echo "Maximum Blender repair attempts reached."
              exit 1
            fi

            REPAIR=$((REPAIR + 1))

            echo ""
            echo "Sending Blender error to Gemini..."
            echo "Repair attempt: $REPAIR / $MAX_REPAIRS"

            python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path(
              "blender_scene/blender_scene.py"
          ).read_text(
              encoding="utf-8"
          )

          error = Path(
              "blender_scene/blender_run.log"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          if len(error) > 16000:
              error = error[-16000:]

          prompt = f"""
          You are repairing a Blender 4.0.2 Python script for Project_Diboo.

          Return ONLY the complete corrected Python script.
          No Markdown.
          No code fences.
          No explanations.

          Requirements:

          - Blender 4.0.2 background mode.
          - import bpy.
          - use stable bpy APIs.
          - never use bpy.ops.mesh.create_plane.
          - use bpy.ops.mesh.primitive_plane_add for planes.
          - never access material node inputs by numeric index.
          - use named node sockets.
          - color sockets receive RGBA tuples.
          - float sockets receive floats.
          - create camera.
          - set scene.camera.
          - create at least one light.
          - use scene.render.engine = 'BLENDER_EEVEE'.
          - NEVER use BLENDER_EEVEE_NEXT.
          - 1080x1920.
          - 24 FPS.
          - preserve visual story.
          - preserve character continuity.
          - expressive poses.
          - readable silhouettes.
          - no cardboard-like presentation.
          - no static mannequin characters.
          - no simulations.
          - no external assets.
          - no downloads.
          - no audio.
          - no narration.
          - no subtitles.
          - save to /tmp/diboo_story_scene.blend.
          - verify the saved file exists.
          - print:
            DIBOO BLENDER SCENE CREATED
            STORY TITLE
            TOTAL FRAMES
            FPS
            RESOLUTION
            BLENDER SCENE READY

          PREVIOUS SCRIPT:

          {script}

          BLENDER ERROR:

          {error}
          """

          request = {
              "model": "gemini-3.5-flash-lite",
              "input": prompt
          }

          Path(
              "repair_request.json"
          ).write_text(
              json.dumps(
                  request,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

            REPAIR_RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @repair_request.json)

            echo "$REPAIR_RESPONSE" \
              > blender_scene/repair_response.json

            python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "blender_scene/repair_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):
              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):
                  if content.get("type") == "text":
                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini repair response contained no script."
              )

          if output_text.startswith("```python"):
              output_text = output_text[
                  len("```python"):
              ]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          if not output_text:
              raise RuntimeError(
                  "Gemini returned empty repaired script."
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              output_text,
              encoding="utf-8"
          )

          print(
              "GEMINI REPAIRED BLENDER SCRIPT RECEIVED"
          )

          print(
              "Characters:",
              len(output_text)
          )
          PY

            python3 -m py_compile \
              blender_scene/blender_scene.py

            echo "Repaired Blender script syntax: PASSED"

          done


      # ============================================================
      # 8. CONFIGURE RENDER
      # ============================================================

      - name: Configure fast Blender render
        run: |
          set -euo pipefail

          DURATION=$(cat /tmp/diboo_duration.txt)

          # CORRECT BASH ARITHMETIC
          END_FRAME=$((DURATION * 24))

          echo "========================================"
          echo "DIBOO FAST BLENDER RENDER"
          echo "========================================"

          echo "DURATION: ${DURATION}s"
          echo "END FRAME: ${END_FRAME}"

          cat > blender_scene/configure_render.py <<'PY'
          import bpy
          import os

          duration_file = "/tmp/diboo_duration.txt"

          with open(
              duration_file,
              "r",
              encoding="utf-8"
          ) as f:
              duration = int(f.read().strip())

          scene = bpy.context.scene

          scene.render.engine = "BLENDER_EEVEE"

          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100

          scene.render.fps = 24

          scene.frame_start = 1
          scene.frame_end = duration * scene.render.fps

          scene.render.image_settings.file_format = "PNG"

          if hasattr(scene, "eevee"):
              try:
                  scene.eevee.taa_render_samples = 8
              except Exception:
                  pass

          output_path = "/tmp/diboo_story_scene.blend"

          bpy.ops.wm.save_as_mainfile(
              filepath=output_path
          )

          if not os.path.exists(output_path):
              raise RuntimeError(
                  "ERROR: Blender scene was not saved."
              )

          print("================================")
          print("DIBOO FAST RENDER CONFIGURATION READY")
          print("================================")

          print("DURATION:")
          print(duration)

          print("RENDER ENGINE:")
          print(scene.render.engine)

          print("RESOLUTION:")
          print("1080x1920")

          print("FPS:")
          print(scene.render.fps)

          print("FRAME START:")
          print(scene.frame_start)

          print("FRAME END:")
          print(scene.frame_end)

          print("TOTAL EXPECTED FRAMES:")
          print(
              scene.frame_end -
              scene.frame_start +
              1
          )

          print("================================")
          print("DIBOO BLENDER SCENE SAVED")
          print("================================")
          PY

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            --python blender_scene/configure_render.py

          test -s \
            /tmp/diboo_story_scene.blend

          ls -lh \
            /tmp/diboo_story_scene.blend


      # ============================================================
      # 9. RENDER COMPLETE ANIMATION
      # ============================================================

      - name: Render complete Project_Diboo animation
        run: |
          set -euo pipefail

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          # CORRECT BASH ARITHMETIC
          END_FRAME=$((DURATION * 24))

          EXPECTED_FRAMES=$END_FRAME

          echo "========================================"
          echo "DIBOO FULL ANIMATION RENDER"
          echo "========================================"

          rm -rf \
            /tmp/diboo_render

          mkdir -p \
            /tmp/diboo_render

          echo "DURATION: ${DURATION}s"
          echo "FRAME START: 1"
          echo "FRAME END: ${END_FRAME}"
          echo "TOTAL EXPECTED FRAMES: ${EXPECTED_FRAMES}"

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -s 1 \
            -e "$END_FRAME" \
            -a

          echo ""
          echo "DIBOO FULL ANIMATION RENDER FINISHED"

          FRAME_COUNT=$(
            find \
              /tmp/diboo_render \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              | wc -l
          )

          echo ""
          echo "TOTAL PNG FRAMES:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -ne "$EXPECTED_FRAMES" ]; then
            echo \
              "ERROR: Expected exactly ${EXPECTED_FRAMES} PNG frames."

            exit 1
          fi

          echo ""
          echo "DIBOO RENDER OUTPUT READY"


      # ============================================================
      # 10. VERIFY RENDER
      # ============================================================

      - name: Verify complete animation render
        run: |
          set -euo pipefail

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          # FIX DEFINITIVO:
          # NO usar:
          # EXPECTED_FRAMES=$( (DURATION * 24) )
          #
          # Usar:
          EXPECTED_FRAMES=$((DURATION * 24))

          echo "========================================"
          echo "DIBOO COMPLETE RENDER VERIFICATION"
          echo "========================================"

          test -d \
            /tmp/diboo_render

          FRAME_COUNT=$(
            find \
              /tmp/diboo_render \
              -maxdepth 1 \
              -type f \
              -name "*.png" \
              | wc -l
          )

          echo "PNG FRAME COUNT:"
          echo "$FRAME_COUNT"

          echo "EXPECTED:"
          echo "$EXPECTED_FRAMES"

          if [ "$FRAME_COUNT" -ne "$EXPECTED_FRAMES" ]; then
            echo \
              "ERROR: Expected ${EXPECTED_FRAMES} frames."

            exit 1
          fi

          echo ""
          echo "TOTAL RENDER SIZE:"
          du -sh \
            /tmp/diboo_render

          echo ""
          echo "DIBOO COMPLETE ANIMATION RENDER: PASSED"


      # ============================================================
      # 11. CREATE AMBIENT AUDIO
      # ============================================================

      - name: Create Project_Diboo ambient audio
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DIBOO AMBIENT AUDIO GENERATION"
          echo "========================================"

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          rm -rf \
            /tmp/diboo_audio

          mkdir -p \
            /tmp/diboo_audio

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          scenes = story["scenes"]

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              duration = int(scene["duration"])

              music = str(
                  scene.get("music", {})
              ).lower()

              output = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_music.wav"
              )

              if any(
                  word in music
                  for word in [
                      "sad",
                      "lonely",
                      "emotional",
                      "melancholy"
                  ]
              ):
                  frequencies = \
                      "196+246.94+293.66"

              elif any(
                  word in music
                  for word in [
                      "tension",
                      "danger",
                      "fear",
                      "suspense"
                  ]
              ):
                  frequencies = \
                      "164.81+207.65+246.94"

              elif any(
                  word in music
                  for word in [
                      "happy",
                      "joy",
                      "playful",
                      "fun",
                      "cute"
                  ]
              ):
                  frequencies = \
                      "261.63+329.63+392.00"

              elif any(
                  word in music
                  for word in [
                      "hope",
                      "warm",
                      "comfort",
                      "relief"
                  ]
              ):
                  frequencies = \
                      "220+277.18+329.63"

              else:
                  frequencies = \
                      "220+277.18+329.63"

              expression = (
                  "0.025*sin(2*PI*"
                  f"({frequencies})/3*t)"
                  "+0.012*sin(2*PI*110*t)"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      (
                          f"aevalsrc="
                          f"{expression}:"
                          f"s=48000:"
                          f"d={duration}"
                      ),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(output)
                  ],
                  check=True
              )

              print(
                  f"Scene {index}: {duration}s"
              )

          concat_file = Path(
              "/tmp/diboo_audio/music_concat.txt"
          )

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:

              for index in range(
                  1,
                  len(scenes) + 1
              ):
                  f.write(
                      "file "
                      f"'/tmp/diboo_audio/"
                      f"scene_{index:02d}_music.wav'\n"
                  )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "/tmp/diboo_audio/music.wav"
              ],
              check=True
          )

          print("")
          print("AMBIENT MUSIC CREATED")
          PY

          echo ""
          echo "Generating procedural SFX..."

          ffmpeg \
            -y \
            -f lavfi \
            -i "aevalsrc=0.035*sin(2*PI*(600-450*t)*t)*exp(-4*t):s=48000:d=0.8" \
            -ar 48000 \
            -ac 2 \
            /tmp/diboo_audio/sfx.wav

          test -s \
            /tmp/diboo_audio/sfx.wav

          echo ""
          echo "Mixing ambient soundtrack..."

          ffmpeg \
            -y \
            -i /tmp/diboo_audio/music.wav \
            -i /tmp/diboo_audio/sfx.wav \
            -filter_complex \
            "[0:a]volume=0.22[music];[1:a]volume=0.10,aloop=loop=-1:size=38400[sfx];[music][sfx]amix=inputs=2:duration=first:dropout_transition=2,loudnorm=I=-18:TP=-2:LRA=11[out]" \
            -map "[out]" \
            -t "$DURATION" \
            -ar 48000 \
            -ac 2 \
            -c:a aac \
            -b:a 128k \
            /tmp/diboo_audio_track.m4a

          test -s \
            /tmp/diboo_audio_track.m4a

          echo ""
          echo "DIBOO AMBIENT AUDIO TRACK READY"


      # ============================================================
      # 12. VERIFY VISUAL ONLY
      # ============================================================

      - name: Verify visual-only production mode
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          forbidden = [
              "narration",
              "subtitles",
              "subtitle",
              "voice"
          ]

          for key in forbidden:
              if key in story:
                  raise RuntimeError(
                      f"Forbidden field detected: {key}"
                  )

          for index, scene in enumerate(
              story["scenes"],
              start=1
          ):

              for key in forbidden:
                  if key in scene:
                      raise RuntimeError(
                          f"Scene {index} contains "
                          f"forbidden field: {key}"
                      )

          print("DIBOO VISUAL-ONLY MODE: PASSED")
          print("Narration: DISABLED")
          print("Subtitles: DISABLED")
          print("Voice: DISABLED")
          print("Ambient music: ENABLED")
          print("SFX: ENABLED")
          PY


      # ============================================================
      # 13. ENCODE FINAL MP4
      # ============================================================

      - name: Encode final Project_Diboo MP4
        run: |
          set -euo pipefail

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          VIDEO_NAME="Project_Diboo_Video_${VIDEO_NUMBER}"

          MP4="/tmp/${VIDEO_NAME}.mp4"

          rm -f "$MP4"

          ffmpeg \
            -y \
            -framerate 24 \
            -start_number 1 \
            -i /tmp/diboo_render/frame_%04d.png \
            -i /tmp/diboo_audio_track.m4a \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -t "$DURATION" \
            -movflags +faststart \
            "$MP4"

          test -s "$MP4"

          cp \
            "$MP4" \
            "output/${VIDEO_NAME}.mp4"

          echo ""
          echo "========================================"
          echo "DIBOO FINAL MP4 CREATED"
          echo "========================================"

          ls -lh "$MP4"


      # ============================================================
      # 14. VERIFY FINAL MP4
      # ============================================================

      - name: Verify final Project_Diboo MP4
        run: |
          set -euo pipefail

          MP4="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          test -s "$MP4"

          echo "========================================"
          echo "DIBOO FINAL MP4 VERIFICATION"
          echo "========================================"

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$MP4"

          echo ""

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            "$MP4"

          VIDEO_STREAMS=$(
            ffprobe \
              -v error \
              -select_streams v \
              -show_entries stream=index \
              -of csv=p=0 \
              "$MP4" \
              | wc -l
          )

          AUDIO_STREAMS=$(
            ffprobe \
              -v error \
              -select_streams a \
              -show_entries stream=index \
              -of csv=p=0 \
              "$MP4" \
              | wc -l
          )

          echo ""
          echo "VIDEO STREAMS:"
          echo "$VIDEO_STREAMS"

          echo "AUDIO STREAMS:"
          echo "$AUDIO_STREAMS"

          if [ "$VIDEO_STREAMS" -lt 1 ]; then
            echo "ERROR: Final MP4 has no video stream."
            exit 1
          fi

          if [ "$AUDIO_STREAMS" -lt 1 ]; then
            echo "ERROR: Final MP4 has no audio stream."
            exit 1
          fi

          echo ""
          echo "DIBOO FINAL MP4: PASSED"


      # ============================================================
      # 15. SEND VIDEO TO TELEGRAM
      # ============================================================

      - name: Send Project_Diboo video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DIBOO TELEGRAM DELIVERY"
          echo "VIDEO $VIDEO_NUMBER / 10"
          echo "========================================"

          MP4="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          test -s "$MP4"

          FILE_SIZE=$(stat -c%s "$MP4")

          # CORRECT BASH ARITHMETIC
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))

          TITLE=$(python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              print(
                  json.load(f)["title"]
              )
          PY
          )

          DESCRIPTION=$(python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              print(
                  json.load(f)["description"]
              )
          PY
          )

          HASHTAGS=$(python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:

              story = json.load(f)

          print(
              " ".join(
                  str(x)
                  for x in story["hashtags"]
              )
          )
          PY
          )

          CAPTION="🎬 Project_Diboo #${VIDEO_NUMBER}

          ${TITLE}

          ${DESCRIPTION}

          ${HASHTAGS}"

          echo ""
          echo "VIDEO:"
          echo "$VIDEO_NUMBER"

          echo ""
          echo "TITLE:"
          echo "$TITLE"

          echo ""
          echo "SIZE:"
          echo "${FILE_SIZE_MB} MB"

          if [ "$FILE_SIZE" -le 52428800 ]; then

            echo ""
            echo "Sending complete video to Telegram..."

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@${MP4}" \
              --form-string "caption=${CAPTION}" \
              -F "supports_streaming=true")

            echo ""
            echo "Telegram response:"
            echo "$RESPONSE"

            echo "$RESPONSE" \
              | grep -q '"ok":true'

            echo ""
            echo "DIBOO TELEGRAM VIDEO ${VIDEO_NUMBER}: PASSED"

          else

            echo ""
            echo "MP4 exceeds configured Telegram upload limit."

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode \
              "text=PROJECT_DIBOO VIDEO ${VIDEO_NUMBER} COMPLETE. Title: ${TITLE}. MP4 size: ${FILE_SIZE_MB} MB. The video is available in the GitHub Actions artifact.")

            echo "$RESPONSE"

            echo "$RESPONSE" \
              | grep -q '"ok":true'

          fi


      # ============================================================
      # 16. UPLOAD MP4 ARTIFACT
      # ============================================================

      - name: Upload Project_Diboo MP4
        uses: actions/upload-artifact@v4

        with:
          name: Project_Diboo_Video_${{ matrix.video_number }}

          path: output/Project_Diboo_Video_${{ matrix.video_number }}.mp4

          if-no-files-found: error

          retention-days: 7


      # ============================================================
      # 17. UPLOAD METADATA
      # ============================================================

      - name: Upload Project_Diboo metadata
        uses: actions/upload-artifact@v4

        with:
          name: Project_Diboo_Metadata_${{ matrix.video_number }}

          path: |
            story.json
            blender_scene/blender_scene.py
            blender_scene/blender_run.log

          if-no-files-found: error

          retention-days: 7


      # ============================================================
      # 18. FINAL VIDEO TEST
      # ============================================================

      - name: Complete Project_Diboo video test
        run: |
          set -euo pipefail

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          # CORRECT BASH ARITHMETIC
          FRAMES=$((DURATION * 24))

          MP4="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          test -s "$MP4"

          echo ""
          echo "========================================"
          echo "PROJECT_DIBOO"
          echo "VIDEO ${VIDEO_NUMBER} FINAL TEST"
          echo "========================================"

          echo ""
          echo "Story generation: PASSED"
          echo "Visual story validation: PASSED"
          echo "Blender script validation: PASSED"
          echo "Blender scene generation: PASSED"
          echo "Render configuration: PASSED"
          echo "Full animation render: PASSED"
          echo "Render verification: PASSED"
          echo "Ambient music generation: PASSED"
          echo "Procedural SFX: PASSED"
          echo "Audio mixing: PASSED"
          echo "Visual-only mode: PASSED"
          echo "No narration: PASSED"
          echo "No subtitles: PASSED"
          echo "Final MP4 encoding: PASSED"
          echo "Final MP4 verification: PASSED"
          echo "Telegram delivery: PASSED"
          echo "MP4 artifact upload: PASSED"
          echo "Metadata upload: PASSED"

          echo ""
          echo "DURATION:"
          echo "${DURATION} seconds"

          echo ""
          echo "FRAMES:"
          echo "${FRAMES}"

          echo ""
          echo "VIDEO:"
          echo "1080x1920"
          echo "24 FPS"
          echo "EEVEE"

          echo ""
          echo "AUDIO:"
          echo "Ambient music + SFX"
          echo "No voice"

          echo ""
          echo "TEXT:"
          echo "No subtitles"

          echo ""
          echo "========================================"
          echo "PROJECT_DIBOO VIDEO ${VIDEO_NUMBER}: PASSED"
          echo "========================================"

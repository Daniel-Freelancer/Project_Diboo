          import json
          import subprocess
          from pathlib import Path

          story = json.loads(
              Path(
                  "story.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          scenes = story["scenes"]

          def run_ffmpeg(args):
              subprocess.run(
                  args,
                  check=True
              )

          def make_scene_audio(index, scene):

              duration = max(
                  1,
                  int(scene["duration"])
              )

              music_text = str(
                  scene.get("music", "")
              ).lower()

              sfx_text = str(
                  scene.get("sfx", "")
              ).lower()

              emotion_text = str(
                  scene.get("emotion", "")
              ).lower()

              combined = (
                  music_text +
                  " " +
                  sfx_text +
                  " " +
                  emotion_text
              )

              # --------------------------------------------------
              # MUSIC CHARACTER
              # --------------------------------------------------

              if any(
                  word in combined
                  for word in (
                      "sad",
                      "lonely",
                      "melancholy",
                      "grief",
                      "emotional"
                  )
              ):
                  base1 = "174.61"
                  base2 = "220.00"
                  base3 = "261.63"

              elif any(
                  word in combined
                  for word in (
                      "tension",
                      "danger",
                      "fear",
                      "suspense",
                      "mystery"
                  )
              ):
                  base1 = "146.83"
                  base2 = "174.61"
                  base3 = "220.00"

              elif any(
                  word in combined
                  for word in (
                      "happy",
                      "joy",
                      "playful",
                      "fun",
                      "cute",
                      "wonder"
                  )
              ):
                  base1 = "261.63"
                  base2 = "329.63"
                  base3 = "392.00"

              else:
                  base1 = "196.00"
                  base2 = "246.94"
                  base3 = "293.66"

              # --------------------------------------------------
              # SOFT AMBIENT MUSIC PAD
              # --------------------------------------------------

              music_expr = (
                  f"0.018*sin(2*PI*{base1}*t)"
                  f"+0.014*sin(2*PI*{base2}*t)"
                  f"+0.010*sin(2*PI*{base3}*t)"
                  f"+0.006*sin(2*PI*55*t)"
              )

              music_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_music.wav"
              )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      (
                          f"aevalsrc={music_expr}:"
                          f"s=48000:"
                          f"d={duration}"
                      ),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(music_path)
                  ]
              )

              # --------------------------------------------------
              # NATURAL WIND / AIR BED
              # --------------------------------------------------

              wind_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_wind.wav"
              )

              wind_filter = (
                  "anoisesrc="
                  "color=pink:"
                  "amplitude=0.10:"
                  f"d={duration},"
                  "lowpass=f=1200,"
                  "highpass=f=80,"
                  "tremolo=f=0.08:d=0.65,"
                  "volume=0.55"
              )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      wind_filter,
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(wind_path)
                  ]
              )

              # --------------------------------------------------
              # WATER / STREAM TEXTURE
              # --------------------------------------------------

              water_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_water.wav"
              )

              water_filter = (
                  "anoisesrc="
                  "color=brown:"
                  "amplitude=0.08:"
                  f"d={duration},"
                  "highpass=f=500,"
                  "lowpass=f=5000,"
                  "volume=0.45"
              )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      water_filter,
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(water_path)
                  ]
              )

              # --------------------------------------------------
              # LEAF / FOREST TEXTURE
              # --------------------------------------------------

              leaf_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_leaves.wav"
              )

              leaf_filter = (
                  "anoisesrc="
                  "color=white:"
                  "amplitude=0.045:"
                  f"d={duration},"
                  "highpass=f=1800,"
                  "lowpass=f=7000,"
                  "tremolo=f=0.7:d=0.85,"
                  "volume=0.45"
              )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      leaf_filter,
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(leaf_path)
                  ]
              )

              # --------------------------------------------------
              # BIRD-LIKE CHIRPS
              # --------------------------------------------------

              bird_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_birds.wav"
              )

              chirp_expr = (
                  "0.0"
              )

              chirps = [
                  2.7,
                  8.9,
                  16.4,
                  25.1,
                  34.8,
                  43.2
              ]

              usable = [
                  t
                  for t in chirps
                  if t < duration - 0.3
              ]

              bird_parts = []

              for t in usable:

                  local = (
                      f"(if("
                      f"gt(t,{t}),"
                      f"if(lt(t,{t + 0.32}),"
                      f"0.025*sin("
                      f"2*PI*("
                      f"2100+900*(t-{t})/"
                      f"0.32"
                      f")*t)"
                      f",0),0))"
                  )

                  bird_parts.append(
                      local
                  )

              if bird_parts:
                  chirp_expr = "+".join(
                      bird_parts
                  )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      (
                          f"aevalsrc={chirp_expr}:"
                          f"s=48000:"
                          f"d={duration}"
                      ),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(bird_path)
                  ]
              )

              # --------------------------------------------------
              # SFX EVENTS
              # --------------------------------------------------

              sfx_path = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_sfx.wav"
              )

              sfx_expr = "0.0"

              # Soft footstep / movement texture.
              if any(
                  word in sfx_text
                  for word in (
                      "step",
                      "foot",
                      "walk",
                      "run",
                      "running"
                  )
              ):

                  step_times = [
                      0.45,
                      1.05,
                      1.65,
                      2.25,
                      2.85,
                      3.45
                  ]

                  parts = []

                  for t in step_times:

                      if t >= duration:
                          continue

                      parts.append(
                          "("
                          f"if(gt(t,{t}),"
                          f"if(lt(t,{t+0.09}),"
                          "0.035*"
                          "exp(-45*(t-"
                          f"{t}"
                          "))*"
                          "sin(2*PI*95*t),"
                          "0),0)"
                          ")"
                      )

                  if parts:
                      sfx_expr = "+".join(parts)

              # Soft impact / object movement.
              elif any(
                  word in sfx_text
                  for word in (
                      "impact",
                      "hit",
                      "fall",
                      "thump",
                      "bump",
                      "drop"
                  )
              ):

                  sfx_expr = (
                      "if(gt(t,0.55),"
                      "0.045*exp(-9*(t-0.55))*"
                      "sin(2*PI*75*t),0)"
                  )

              # Rustle / movement in vegetation.
              elif any(
                  word in sfx_text
                  for word in (
                      "rustle",
                      "leaves",
                      "leaf",
                      "grass",
                      "bush"
                  )
              ):

                  sfx_expr = (
                      "0.025*sin(2*PI*180*t)"
                      "*abs(sin(2*PI*2.5*t))"
                  )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      (
                          f"aevalsrc={sfx_expr}:"
                          f"s=48000:"
                          f"d={duration}"
                      ),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(sfx_path)
                  ]
              )

              # --------------------------------------------------
              # SCENE MIX
              # --------------------------------------------------

              scene_mix = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}.wav"
              )

              # Always-present natural atmosphere.
              # Extra layers are kept subtle so they do not
              # overpower the music or storytelling.

              filter_complex = (
                  "[0:a]volume=0.24[music];"
                  "[1:a]volume=0.14[wind];"
                  "[2:a]volume=0.10[water];"
                  "[3:a]volume=0.08[leaves];"
                  "[4:a]volume=0.045[birds];"
                  "[5:a]volume=0.16[sfx];"
                  "[music][wind][water][leaves][birds][sfx]"
                  "amix=inputs=6:"
                  "duration=longest:"
                  "dropout_transition=2,"
                  "loudnorm=I=-20:TP=-2:LRA=10"
              )

              run_ffmpeg(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(music_path),
                      "-i",
                      str(wind_path),
                      "-i",
                      str(water_path),
                      "-i",
                      str(leaf_path),
                      "-i",
                      str(bird_path),
                      "-i",
                      str(sfx_path),
                      "-filter_complex",
                      filter_complex,
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(scene_mix)
                  ]
              )

          for index, scene in enumerate(
              scenes,
              1
          ):
              make_scene_audio(
                  index,
                  scene
              )

          concat = Path(
              "/tmp/diboo_audio/"
              "audio_concat.txt"
          )

          concat.write_text(
              "".join(
                  (
                      f"file "
                      f"'/tmp/diboo_audio/"
                      f"scene_{i:02d}.wav'\n"
                  )
                  for i in range(
                      1,
                      len(scenes) + 1
                  )
              ),
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat),
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "/tmp/diboo_audio/ambient_master.wav"
              ],
              check=True
          )
          PY

          ffmpeg \
            -y \
            -i \
            /tmp/diboo_audio/ambient_master.wav \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -ac 2 \
            /tmp/diboo_audio_track.m4a

          test -s \
            /tmp/diboo_audio_track.m4a

          echo \
            "DIBOO NATURAL AMBIENT AUDIO: PASSED"

      # ============================================================
      # VISUAL-ONLY STORY VALIDATION
      # ============================================================

      - name: Verify visual-only production mode
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          story = json.loads(
              Path(
                  "story.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          forbidden = {
              "narration",
              "voice",
              "subtitle",
              "subtitles"
          }

          for key in forbidden:

              if key in story:
                  raise RuntimeError(
                      f"Forbidden story field: {key}"
                  )

          for i, scene in enumerate(
              story["scenes"],
              1
          ):

              for key in forbidden:

                  if key in scene:
                      raise RuntimeError(
                          f"Forbidden scene field {key} in scene {i}"
                      )

          print(
              "DIBOO VISUAL-ONLY MODE: PASSED"
          )
          PY

      # ============================================================
      # ENCODE MP4
      # ============================================================

      - name: Encode final MP4
        shell: bash
        run: |
          set -Eeuo pipefail

          DURATION="$(
            cat /tmp/diboo_duration.txt
          )"

          VIDEO_NAME="Project_Diboo_Video_${VIDEO_NUMBER}"
          MP4="/tmp/${VIDEO_NAME}.mp4"

          rm -f \
            "${MP4}"

          ffmpeg \
            -y \
            -framerate 24 \
            -start_number 1 \
            -i \
            /tmp/diboo_render/frame_%04d.png \
            -i \
            /tmp/diboo_audio_track.m4a \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -t "${DURATION}" \
            -movflags +faststart \
            "${MP4}"

          test -s \
            "${MP4}"

          cp \
            "${MP4}" \
            "output/${VIDEO_NAME}.mp4"

          ls -lh \
            "${MP4}"

      # ============================================================
      # VERIFY MP4
      # ============================================================

      - name: Verify final MP4
        shell: bash
        run: |
          set -Eeuo pipefail

          MP4="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          test -s \
            "${MP4}"

          ffprobe \
            -v error \
            -show_entries \
            stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "${MP4}"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            "${MP4}"

          VIDEO_STREAMS="$(
            ffprobe \
              -v error \
              -select_streams v \
              -show_entries stream=index \
              -of csv=p=0 \
              "${MP4}" |
            wc -l
          )"

          AUDIO_STREAMS="$(
            ffprobe \
              -v error \
              -select_streams a \
              -show_entries stream=index \
              -of csv=p=0 \
              "${MP4}" |
            wc -l
          )"

          if [[ "${VIDEO_STREAMS}" -lt 1 ]]; then
            exit 1
          fi

          if [[ "${AUDIO_STREAMS}" -lt 1 ]]; then
            exit 1
          fi

          WIDTH_ACTUAL="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "${MP4}"
          )"

          HEIGHT_ACTUAL="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "${MP4}"
          )"

          if [[ "${WIDTH_ACTUAL}" != "1080" ]]; then
            exit 1
          fi

          if [[ "${HEIGHT_ACTUAL}" != "1920" ]]; then
            exit 1
          fi

          echo \
            "DIBOO FINAL MP4: PASSED"

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: Send Project_Diboo video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n \
            "${TELEGRAM_BOT_TOKEN}"

          test -n \
            "${TELEGRAM_CHAT_ID}"

          ORIGINAL="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          SEND_FILE="${ORIGINAL}"

          TITLE="$(
            python3 - <<'PY'
          import json

          print(
              json.load(
                  open(
                      "story.json",
                      encoding="utf-8"
                  )
              )["title"]
          )
          PY
          )"

          DESCRIPTION="$(
            python3 - <<'PY'
          import json

          print(
              json.load(
                  open(
                      "story.json",
                      encoding="utf-8"
                  )
              )["description"]
          )
          PY
          )"

          HASHTAGS="$(
            python3 - <<'PY'
          import json

          s = json.load(
              open(
                  "story.json",
                  encoding="utf-8"
              )
          )

          print(
              " ".join(
                  map(
                      str,
                      s["hashtags"]
                  )
              )
          )
          PY
          )"

          CAPTION="$(
            printf \
              '🎬 Project_Diboo #%s\n\n%s\n\n%s\n\n%s' \
              "${VIDEO_NUMBER}" \
              "${TITLE}" \
              "${DESCRIPTION}" \
              "${HASHTAGS}"
          )"

          CAPTION="$(
            printf '%s' \
              "${CAPTION}" |
            cut -c1-1000
          )"

          SIZE="$(
            stat -c%s \
              "${ORIGINAL}"
          )"

          if [[ "${SIZE}" -gt 52400000 ]]; then

            echo \
              "Original exceeds safe Telegram size; creating delivery copy."

            DURATION_FLOAT="$(
              ffprobe \
                -v error \
                -show_entries format=duration \
                -of csv=p=0 \
                "${ORIGINAL}"
            )"

            TARGET_KBPS="$(
              python3 \
                - "${DURATION_FLOAT}" \
                <<'PY'
          import sys

          duration = max(
              float(sys.argv[1]),
              1.0
          )

          kbps = max(
              900,
              min(
                  7000,
                  int(
                      (
                          45 * 1024 * 8 /
                          duration
                      ) - 160
                  )
              )
          )

          print(kbps)
          PY
            )"

            ffmpeg \
              -y \
              -i "${ORIGINAL}" \
              -vf \
              "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
              -c:v libx264 \
              -preset fast \
              -b:v "${TARGET_KBPS}k" \
              -maxrate "${TARGET_KBPS}k" \
              -bufsize "$((TARGET_KBPS * 2))k" \
              -c:a aac \
              -b:a 96k \
              -movflags +faststart \
              /tmp/telegram_delivery.mp4

            SEND_FILE="/tmp/telegram_delivery.mp4"
          fi

          FINAL_SIZE="$(
            stat -c%s \
              "${SEND_FILE}"
          )"

          echo \
            "Telegram file size: ${FINAL_SIZE} bytes"

          if [[ "${FINAL_SIZE}" -gt 52428800 ]]; then

            echo \
              "Telegram delivery copy is still too large."

            echo \
              "The original MP4 remains available as the artifact."

            exit 1
          fi

          SUCCESS=0

          for ATTEMPT in 1 2 3; do

            echo \
              "Telegram attempt ${ATTEMPT}/3"

            set +e

            RESPONSE="$(
              curl -sS \
                --connect-timeout 20 \
                --max-time 180 \
                --retry 0 \
                -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
                -F \
                  "chat_id=${TELEGRAM_CHAT_ID}" \
                -F \
                  "video=@${SEND_FILE}" \
                --form-string \
                  "caption=${CAPTION}" \
                -F \
                  "supports_streaming=true"
            )"

            EXIT_CODE=$?

            set -e

            echo \
              "${RESPONSE}"

            if [[ "${EXIT_CODE}" -eq 0 ]] &&
               printf '%s' "${RESPONSE}" |
               grep -q '"ok":true'
            then

              SUCCESS=1
              break
            fi

            sleep $((ATTEMPT * 5))

          done

          if [[ "${SUCCESS}" -ne 1 ]]; then

            echo \
              "Telegram delivery failed."

            exit 1
          fi

          echo \
            "DIBOO TELEGRAM VIDEO ${VIDEO_NUMBER}: PASSED"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project_Diboo_Video_${{ matrix.video_number }}
          path: output/Project_Diboo_Video_${{ matrix.video_number }}.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload metadata and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project_Diboo_Metadata_${{ matrix.video_number }}
          path: |
            story.json
            blender_scene/blender_scene.py
            blender_scene/blender_run.log
            blender_scene/blender_scene_error.log
            blender_scene/py_compile_error.log
            blender_scene/repair_response.json
            package_repair_response.json
            gemini_response.json
            gemini_model_output.txt
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # FINAL TEST
      # ============================================================

      - name: Final Project_Diboo test
        shell: bash
        run: |
          set -Eeuo pipefail

          DURATION="$(
            cat /tmp/diboo_duration.txt
          )"

          FRAMES=$((DURATION * 24))

          MP4="/tmp/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          test -s \
            "${MP4}"

          test -s \
            "output/Project_Diboo_Video_${VIDEO_NUMBER}.mp4"

          echo "========================================"
          echo \
            "PROJECT_DIBOO VIDEO ${VIDEO_NUMBER}: PASSED"
          echo "========================================"

          echo \
            "Duration: ${DURATION}s"

          echo \
            "Frames: ${FRAMES}"

          echo \
            "Resolution: 1080x1920"

          echo \
            "FPS: 24"

          echo \
            "Engine: EEVEE"

          echo \
            "Audio: Natural ambient + procedural SFX"

          echo \
            "Voice: OFF"

          echo \
            "Subtitles: OFF"

          echo \
            "Visual references: NOT YET ENABLED"

          echo \
            "Telegram: PASSED"

          echo \
            "Artifact: PASSED"

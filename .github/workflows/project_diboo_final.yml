              1
          )

          print('================================')
          print(
              'DIBOO BLENDER SCENE SAVED'
          )
          print('================================')

          print(output_path)
          PY

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            --python blender_scene/configure_render.py

          test -s \
            /tmp/diboo_story_scene.blend

          ls -lh \

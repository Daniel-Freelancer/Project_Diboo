              story = json.load(f)

          forbidden = [
              "narration",
              "subtitles",
              "subtitle",
              "voice"
          ]

          for key in forbidden:

              if key in story:

                  raise RuntimeError(
                      f"Forbidden field detected: {key}"
                  )

          for index, scene in enumerate(
              story["scenes"],
              start=1
          ):

              for key in forbidden:

                  if key in scene:

                      raise RuntimeError(
                          f"Scene {index} contains "
                          f"forbidden field: {key}"
                      )

          print("")
          print(
              "DIBOO VISUAL-ONLY MODE: PASSED"

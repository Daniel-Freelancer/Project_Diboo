name: Project_Diboo_Final

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE VISUAL STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate Project_Diboo story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "FINAL AUTOMATED PIPELINE"
          echo "VISUAL STORY + BLENDER GENERATOR"
          echo "================================"

          mkdir -p blender_scene
          mkdir -p logs

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the complete visual story, editing-plan and Blender procedural generation engine for Project_Diboo, an original animated short-form channel. Generate BOTH a complete structured production package and a complete Blender Python script in ONE response. The final result is an original animated YouTube Short / TikTok Short designed to work primarily through VISUAL STORYTELLING. There must be NO spoken narration, NO voice-over and NO subtitles. The viewer must understand the story from the animation itself, the characters' actions, expressions, staging, camera work, visual cause-and-effect and sound design. The final video must feel like an actual animated short, NOT like a collection of primitive 3D objects, NOT like cardboard, NOT like a basic Blender test, NOT like a technical visualization and NOT like an educational 3D demo. Think in terms of an animated-channel production: expressive characters, readable silhouettes, appealing proportions, strong posing, clear emotional beats, visual comedy or emotion, cinematic framing, deliberate camera movement, continuity between shots and a strong beginning-middle-ending structure. Do not imitate or copy any existing copyrighted animation, character, franchise or protected visual style. The visual language must remain original. Until external visual references are provided, prioritize polished animated storytelling over technical realism. The final story should be simple enough to understand immediately but emotionally engaging enough to make the viewer continue watching. A simple premise can be extremely effective if the visual hook, escalation and payoff are strong. Example structure: a vulnerable animal is introduced in a visually clear problem, the viewer sees the neglect or danger through actions rather than narration, tension increases, another character notices the situation, attempts to help, and the ending provides a satisfying emotional payoff. Do not force this exact example; create an original story each time. TARGET approximately 50 seconds and remain between 40 and 60 seconds. Use English only for metadata and scene descriptions. Use 24 FPS and vertical 1080x1920 composition. RETURN ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly these fields: title, description, hashtags, duration_target, language, hook, visual_theme, music, scenes. duration_target MUST be a plain integer between 40 and 60. language MUST be en. hook MUST be a non-empty string describing the opening visual hook. visual_theme MUST be a non-empty object containing style, palette, lighting, animation and camera. music MUST be a non-empty object containing style, mood, intensity, instrumentation and timing. scenes MUST be a non-empty list. EVERY scene MUST contain: duration, description, camera, action, emotion, visual_transition, sfx, music. Scene duration MUST be a plain positive integer. The total scene duration should approximately equal duration_target. Do NOT create narration fields. Do NOT create subtitle fields. Do NOT create voice fields. The entire story must be understandable without dialogue or text. Use visual acting instead. Characters must communicate through body language, facial expressions, eye direction, movement, timing and staging. Each scene should have a clear visual purpose. The opening scene must immediately establish a strong visual hook. The middle must escalate the situation or reveal new information. The final scenes must provide a clear payoff. Avoid random disconnected events. Maintain character identity, environment continuity and object continuity between scenes. The description must be suitable for the YouTube/TikTok post. Hashtags must be a list of relevant hashtags. Music must describe an original royalty-free ambient score that changes according to the emotional circumstance of the scene. Music must never depend on external music files. SFX must describe simple effects that can later be synthesized procedurally. The Blender script MUST be a complete standalone Python script for Blender 4.0.2. The script MUST be conservative, deterministic and reliable. It MUST NOT depend on external files, addons, downloads, textures, fonts, images, sounds or network access. It MUST run correctly in Blender 4.0.2 background mode using: blender -b --python blender_scene.py. The script MUST import bpy and math only unless another Python standard-library module is absolutely necessary. It MUST first clear the default scene using bpy.ops.object.select_all(action='SELECT') and bpy.ops.object.delete(use_global=False). Use stable Blender 4.0.2 operators. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. Use cubes, spheres, cylinders, cones and planes only. Create materials using bpy.data.materials.new and diffuse_color whenever possible. If using nodes, NEVER access Principled BSDF inputs by numeric indexes. NEVER use inputs[21], inputs[20], inputs[0] or any numeric socket index. Access sockets only by name. Color values MUST be 4-value RGBA tuples. Float values MUST be single floats. Create the camera BEFORE creating animation. Set scene.camera = camera. Create at least one light. Use scene.render.engine = 'BLENDER_EEVEE' exactly. NEVER use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100 and 24 FPS. Convert duration_target to frames. Set scene.frame_start = 1 and scene.frame_end = duration_target * scene.render.fps. Keep geometry and lighting simple enough for fast EEVEE rendering but prioritize appealing animated silhouettes and visual readability. Avoid simulations, particle systems, geometry nodes, compositing, volumetrics, cloth, smoke, fire, rigid body simulations and expensive modifiers. Prefer simple keyframe animation. Every animated object must already exist before keyframes are inserted. Use strong vertical composition. Keep important characters and actions inside the central safe area. Use deliberate close-ups, medium shots and wider establishing shots rather than one static camera for the entire video. Use camera movement when it improves storytelling. Characters should have readable poses and expressive animation. Avoid characters that look like rigid mannequins. Use simple facial features and body parts where practical. Avoid excessive geometric detail that slows rendering. The goal is not photorealism. The goal is appealing animated storytelling. Do NOT generate audio inside Blender. Do NOT depend on external audio files. Audio will be generated later in the pipeline. Before saving, verify that scene.camera is not None. The script MUST save the Blender scene using bpy.ops.wm.save_as_mainfile(filepath='/tmp/diboo_story_scene.blend'). After saving, verify that the file exists using Python standard library os.path.exists. At the end print exactly these diagnostic messages: DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION, BLENDER SCENE READY. The script must not render anything itself. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo "Gemini temporarily unavailable."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE '"code": ?429|too_many_requests|Rate limit exceeded'; then
                echo "Gemini rate limit reached."
                sleep 60
                continue
              fi

              echo "===== GEMINI API ERROR ====="
              cat gemini_response.json
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "===== GEMINI FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo "===== GEMINI RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract Project_Diboo files
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini response did not contain model output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          try:
              generated = json.loads(output_text)

          except json.JSONDecodeError as error:

              print("===== INVALID GEMINI JSON =====")
              print(output_text)

              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(story, dict):
              raise RuntimeError(
                  "story must be an object."
              )

          if not isinstance(blender_script, str):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[len("```python"):]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = blender_script.rstrip()[:-3]

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")
          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print(
              "blender_scene/blender_scene.py"
          )

          print("")
          print("Script size:")
          print(
              len(blender_script),
              "characters"
          )
          PY


      # ============================================================
      # 3. VALIDATE COMPLETE PROJECT_DIBOO STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "description",
              "hashtags",
              "duration_target",
              "language",
              "hook",
              "visual_theme",
              "music",
              "scenes"
          ]

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

              if story[field] is None:
                  raise RuntimeError(
                      f"Required field is null: {field}"
                  )

          if not isinstance(
              story["title"],
              str
          ) or not story["title"].strip():

              raise RuntimeError(
                  "title must be a non-empty string."
              )

          if not isinstance(
              story["description"],
              str
          ) or not story["description"].strip():

              raise RuntimeError(
                  "description must be a non-empty string."
              )

          if not isinstance(
              story["hook"],
              str
          ) or not story["hook"].strip():

              raise RuntimeError(
                  "hook must be a non-empty string."
              )

          if str(
              story["language"]
          ).lower() != "en":

              raise RuntimeError(
                  "Story language must be English (en)."
              )

          visual_theme = story["visual_theme"]

          if not isinstance(
              visual_theme,
              dict
          ):

              raise RuntimeError(
                  "visual_theme must be an object."
              )

          for field in [
              "style",
              "palette",
              "lighting",
              "animation",
              "camera"
          ]:

              if field not in visual_theme:

                  raise RuntimeError(
                      f"visual_theme missing: {field}"
                  )

          raw_duration = story[
              "duration_target"
          ]

          if isinstance(
              raw_duration,
              bool
          ):

              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          if isinstance(
              raw_duration,
              int
          ):

              duration = raw_duration

          elif isinstance(
              raw_duration,
              float
          ):

              duration = int(
                  raw_duration
              )

          elif isinstance(
              raw_duration,
              str
          ):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:

                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(
                  match.group(0)
              )

          else:

              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          if not 40 <= duration <= 60:

              raise RuntimeError(
                  f"Invalid duration: {duration}. "
                  "Must be 40-60 seconds."
              )

          hashtags = story[
              "hashtags"
          ]

          if not isinstance(
              hashtags,
              list
          ) or not hashtags:

              raise RuntimeError(
                  "hashtags must be a non-empty list."
              )

          music = story[
              "music"
          ]

          if not isinstance(
              music,
              dict
          ):

              raise RuntimeError(
                  "music must be an object."
              )

          for field in [
              "style",
              "mood",
              "intensity",
              "instrumentation",
              "timing"
          ]:

              if field not in music:

                  raise RuntimeError(
                      f"music missing required field: {field}"
                  )

          scenes = story[
              "scenes"
          ]

          if not isinstance(
              scenes,
              list
          ) or not scenes:

              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "emotion",
              "visual_transition",
              "sfx",
              "music"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(
                  scene,
                  dict
              ):

                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:

                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw_scene_duration = scene[
                  "duration"
              ]

              if isinstance(
                  raw_scene_duration,
                  bool
              ):

                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              if isinstance(
                  raw_scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      raw_scene_duration
                  )

                  if not match:

                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(
                  raw_scene_duration,
                  (int, float)
              ):

                  scene_duration = int(
                      raw_scene_duration
                  )

              else:

                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:

                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration

              total_scene_duration += scene_duration

          if abs(
              total_scene_duration - duration
          ) > 5:

              raise RuntimeError(
                  f"Total scene duration "
                  f"({total_scene_duration}s) "
                  f"differs too much from target "
                  f"duration ({duration}s)."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "/tmp/diboo_duration.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  str(duration)
              )

          print("")
          print(
              "DIBOO STORY VALIDATION: PASSED"
          )

          print("")
          print("TITLE:")
          print(story["title"])

          print("")
          print("HOOK:")
          print(story["hook"])

          print("")
          print("VISUAL THEME:")
          print(
              story["visual_theme"]
          )

          print("")
          print("DURATION:")
          print(
              duration,
              "seconds"
          )

          print("")
          print("SCENES:")
          print(
              len(scenes)
          )

          print("")
          print("TOTAL SCENE DURATION:")
          print(
              total_scene_duration,
              "seconds"
          )

          print("")
          print("================================")
          print(
              "PROJECT_DIBOO STORY: PASSED"
          )
          print("================================")
          PY


      # ============================================================
      # 4. VALIDATE BLENDER PYTHON SYNTAX
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCRIPT VALIDATION"
          echo "================================"

          test -s \
            blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax: PASSED"

          ls -lh \
            blender_scene/blender_scene.py


      # ============================================================
      # 5. PREPARE BLENDER + FFMPEG
      # ============================================================

      - name: Prepare Blender and FFmpeg
        run: |
          set -e

          echo "================================"
          echo "DIBOO TOOL PREPARATION"
          echo "================================"

          sudo apt-get update

          sudo apt-get install -y \
            blender \
            ffmpeg \
            libtbb12 \
            libegl1 \
            libgl1 \
            libglib2.0-0

          echo ""
          echo "BLENDER:"
          blender --version | head -n 1

          echo ""
          echo "FFMPEG:"
          ffmpeg -version | head -n 1

          echo ""
          echo "DIBOO TOOLS READY"


      # ============================================================
      # 6. BLENDER SCENE GENERATION WITH AUTO-RECOVERY
      # ============================================================

      - name: Generate Blender scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "================================"

          rm -f \
            /tmp/diboo_story_scene.blend

          rm -f \
            blender_scene/blender_scene_error.log

          MAX_REPAIRS=3
          REPAIR=0

          while true
          do

            echo ""
            echo "================================"
            echo "BLENDER GENERATION ATTEMPT"
            echo "$((REPAIR + 1))"
            echo "================================"

            rm -f \
              /tmp/diboo_story_scene.blend

            set +e

            blender \
              -b \
              --python blender_scene/blender_scene.py \
              > blender_scene/blender_run.log 2>&1

            BLENDER_EXIT=$?

            set -e

            echo ""
            echo "BLENDER EXIT CODE:"
            echo "$BLENDER_EXIT"

            if [ "$BLENDER_EXIT" -eq 0 ] && \
               [ -f /tmp/diboo_story_scene.blend ]; then

              echo ""
              echo "================================"
              echo "DIBOO BLENDER SCENE READY"
              echo "================================"

              ls -lh \
                /tmp/diboo_story_scene.blend

              break

            fi

            echo ""
            echo "================================"
            echo "BLENDER SCENE GENERATION FAILED"
            echo "================================"

            tail -n 120 \
              blender_scene/blender_run.log \
              || true

            cp \
              blender_scene/blender_run.log \
              blender_scene/blender_scene_error.log

            if [ "$REPAIR" -ge "$MAX_REPAIRS" ]; then

              echo ""
              echo "Maximum Blender repair attempts reached."

              exit 1

            fi

            REPAIR=$((REPAIR + 1))

            echo ""
            echo "Sending Blender error to Gemini..."
            echo "Repair attempt: $REPAIR / $MAX_REPAIRS"

            python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path(
              "blender_scene/blender_scene.py"
          ).read_text(
              encoding="utf-8"
          )

          error = Path(
              "blender_scene/blender_run.log"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          if len(error) > 16000:
              error = error[-16000:]

          prompt = f"""
          You are repairing a Blender 4.0.2 Python script for Project_Diboo.

          The previous generated script failed during Blender background execution.

          Return ONLY the complete corrected Python script.
          No Markdown.
          No code fences.
          No explanations.

          The corrected script MUST:

          - work in Blender 4.0.2 background mode
          - import bpy
          - use only stable bpy APIs
          - never use bpy.ops.mesh.create_plane
          - use bpy.ops.mesh.primitive_plane_add for planes
          - never access material node inputs by numeric index
          - use named node sockets only
          - color sockets must receive RGBA tuples
          - float sockets must be floats
          - create a camera
          - set scene.camera = camera
          - create at least one light
          - use scene.render.engine = 'BLENDER_EEVEE'
          - NEVER use BLENDER_EEVEE_NEXT
          - configure 1080x1920
          - configure 24 FPS
          - preserve the existing visual story and animation concept
          - preserve character continuity
          - preserve the animated-channel approach
          - prioritize expressive poses and readable silhouettes
          - avoid cardboard-like primitive presentation
          - avoid static mannequin-like characters
          - keep geometry and materials simple enough for EEVEE
          - avoid simulations and expensive effects
          - save to /tmp/diboo_story_scene.blend
          - verify the file exists after saving
          - print DIBOO BLENDER SCENE CREATED
          - print STORY TITLE
          - print TOTAL FRAMES
          - print FPS
          - print RESOLUTION
          - print BLENDER SCENE READY

          IMPORTANT:
          Do not create audio.
          Do not require external assets.
          Do not download anything.
          Do not add narration.
          Do not add subtitles.

          PREVIOUS SCRIPT:

          {script}

          BLENDER ERROR:

          {error}
          """

          request = {
              "model": "gemini-3.5-flash-lite",
              "input": prompt
          }

          Path(
              "repair_request.json"
          ).write_text(
              json.dumps(
                  request,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

            REPAIR_RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @repair_request.json)

            echo "$REPAIR_RESPONSE" \
              > blender_scene/repair_response.json

            python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "blender_scene/repair_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini repair response contained no script."
              )

          if output_text.startswith("```python"):
              output_text = output_text[
                  len("```python"):
              ]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          if not output_text:
              raise RuntimeError(
                  "Gemini returned an empty repaired script."
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              output_text,
              encoding="utf-8"
          )

          print("")
          print(
              "===== GEMINI REPAIRED BLENDER SCRIPT RECEIVED ====="
          )

          print(
              "Characters:",
              len(output_text)
          )
          PY

            python3 -m py_compile \
              blender_scene/blender_scene.py

            echo ""
            echo "Repaired Blender script syntax: PASSED"

          done


      # ============================================================
      # 7. CONFIGURE FAST BLENDER RENDER
      # ============================================================

      - name: Configure fast Blender render
        run: |
          set -e

          DURATION=$(cat /tmp/diboo_duration.txt)

          END_FRAME=$((DURATION * 24))

          echo "================================"
          echo "DIBOO FAST BLENDER RENDER"
          echo "================================"

          echo "DURATION:"
          echo "${DURATION} seconds"

          echo "END FRAME:"
          echo "${END_FRAME}"

          cat > blender_scene/configure_render.py <<'PY'
          import bpy
          import os

          duration_file = \
              "/tmp/diboo_duration.txt"

          with open(
              duration_file,
              "r",
              encoding="utf-8"
          ) as f:

              duration = int(
                  f.read().strip()
              )

          scene = bpy.context.scene

          scene.render.engine = \
              'BLENDER_EEVEE'

          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100

          scene.render.fps = 24

          scene.frame_start = 1

          scene.frame_end = \
              duration * scene.render.fps

          scene.render.image_settings.file_format = \
              'PNG'

          if hasattr(
              scene,
              'eevee'
          ):

              try:

                  scene.eevee.taa_render_samples = 8

              except Exception:

                  pass

          output_path = \
              '/tmp/diboo_story_scene.blend'

          bpy.ops.wm.save_as_mainfile(
              filepath=output_path
          )

          if not os.path.exists(
              output_path
          ):

              raise RuntimeError(
                  'ERROR: Blender scene was not saved.'
              )

          print('================================')
          print(
              'DIBOO FAST RENDER CONFIGURATION READY'
          )
          print('================================')

          print('DURATION:')
          print(duration)

          print('Render engine:')
          print(
              scene.render.engine
          )

          print('EEVEE samples:')
          print(8)

          print('Resolution:')
          print('1080x1920')

          print('FPS:')
          print(
              scene.render.fps
          )

          print('FRAME START:')
          print(
              scene.frame_start
          )

          print('FRAME END:')
          print(
              scene.frame_end
          )

          print('TOTAL EXPECTED FRAMES:')

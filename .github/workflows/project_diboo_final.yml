name: Project_Diboo_Final

on:
  schedule:
    # 00:00 Uruguay (UTC-3) = 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-video:
    name: Project_Diboo Video ${{ matrix.video_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        video_number:
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"

    env:
      VIDEO_NUMBER: ${{ matrix.video_number }}
      FPS: "24"
      WIDTH: "1080"
      HEIGHT: "1920"
      GEMINI_MAX_ATTEMPTS: "5"
      BLENDER_MAX_REPAIRS: "4"

    steps:

      # ============================================================
      # INITIALIZE
      # ============================================================

      - name: Initialize Project_Diboo
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p blender_scene logs output

          echo "========================================"
          echo "PROJECT_DIBOO"
          echo "VIDEO ${VIDEO_NUMBER} / 10"
          echo "========================================"

          date -u
          uname -a

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Prepare Blender and FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            blender \
            ffmpeg \
            libtbb12 \
            libegl1 \
            libgl1 \
            libglib2.0-0

          blender --version | head -n 1
          ffmpeg -version | head -n 1

      # ============================================================
      # GEMINI STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GEMINI_API_KEY}"

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the complete visual story, editing-plan and Blender procedural generation engine for Project_Diboo, an original animated short-form channel. Generate BOTH a complete structured production package and a complete Blender Python script in ONE response. The final result is an original animated YouTube Short / TikTok Short designed primarily through VISUAL STORYTELLING. There must be NO spoken narration, NO voice-over and NO subtitles. The viewer must understand the story from the animation itself, character actions, expressions, staging, camera work, visual cause-and-effect and sound design. The final video must feel like an actual animated short, NOT a collection of primitive 3D objects, NOT cardboard, NOT a basic Blender test, NOT a technical visualization and NOT an educational 3D demo. Use expressive characters, readable silhouettes, appealing proportions, strong posing, emotional beats, visual comedy or emotion, cinematic framing, deliberate camera movement, continuity between shots and a strong beginning-middle-ending structure. Do not imitate or copy any existing copyrighted animation, character, franchise or protected visual style. The visual language must remain original. Create a new original story for this generation. TARGET approximately 50 seconds and remain between 40 and 60 seconds. Use English only for metadata and scene descriptions. Use 24 FPS and vertical 1080x1920 composition. RETURN ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly these fields: title, description, hashtags, duration_target, language, hook, visual_theme, music, scenes. duration_target MUST be a plain integer between 40 and 60. language MUST be en. hook MUST be a non-empty string describing the opening visual hook. visual_theme MUST be a non-empty object containing style, palette, lighting, animation and camera. music MUST be a non-empty object containing style, mood, intensity, instrumentation and timing. scenes MUST be a non-empty list. EVERY scene MUST contain: duration, description, camera, action, emotion, visual_transition, sfx, music. Scene duration MUST be a plain positive integer. The total scene duration should approximately equal duration_target. Do NOT create narration fields. Do NOT create subtitle fields. Do NOT create voice fields. The entire story must be understandable without dialogue or text. Characters must communicate through body language, facial expressions, eye direction, movement, timing and staging. Each scene should have a clear visual purpose. The opening scene must immediately establish a strong visual hook. The middle must escalate the situation or reveal new information. The final scenes must provide a clear payoff. Avoid random disconnected events. Maintain character identity, environment continuity and object continuity between scenes. The description must be suitable for the YouTube/TikTok post. Hashtags must be a list of relevant hashtags. Music must describe an original royalty-free ambient score that changes according to the emotional circumstance of the scene. Music must never depend on external music files. SFX must describe natural or cinematic sound effects that can later be synthesized procedurally. Prefer environmental sounds such as wind, leaves, water, birds, insects, footsteps, cloth movement, wood, soft impacts and natural ambience instead of repetitive beeps or electronic test tones. The Blender script MUST be a complete standalone Python script for Blender 4.0.2. The script MUST be conservative, deterministic and reliable. It MUST NOT depend on external files, addons, downloads, textures, fonts, images, sounds or network access. It MUST run correctly in Blender 4.0.2 background mode using blender -b --python blender_scene.py. The script MUST import bpy and math only unless another Python standard-library module is absolutely necessary. It MUST first clear the default scene using bpy.ops.object.select_all(action='SELECT') and bpy.ops.object.delete(use_global=False). Use stable Blender 4.0.2 operators. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. Use cubes, spheres, cylinders, cones and planes only. Create materials using bpy.data.materials.new and diffuse_color whenever possible. If using nodes, NEVER access Principled BSDF inputs by numeric indexes. NEVER use inputs[21], inputs[20], inputs[0] or any numeric socket index. Access sockets only by name. Color values MUST be 4-value RGBA tuples. Float values MUST be single floats. Create the camera BEFORE creating animation. Set scene.camera = camera. Create at least one light. Use scene.render.engine = 'BLENDER_EEVEE' exactly. NEVER use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100 and 24 FPS. Convert duration_target to frames. Set scene.frame_start = 1 and scene.frame_end = duration_target * scene.render.fps. Keep geometry and lighting simple enough for fast EEVEE rendering but prioritize appealing animated silhouettes and visual readability. Avoid simulations, particle systems, geometry nodes, compositing, volumetrics, cloth, smoke, fire, rigid body simulations and expensive modifiers. Prefer simple keyframe animation. Every animated object must already exist before keyframes are inserted. Use strong vertical composition. Keep important characters and actions inside the central safe area. Use deliberate close-ups, medium shots and wider establishing shots rather than one static camera for the entire video. Use camera movement when it improves storytelling. Characters should have readable poses and expressive animation. Avoid characters that look like rigid mannequins. Use simple facial features and body parts where practical. Avoid excessive geometric detail that slows rendering. The goal is appealing animated storytelling, not photorealism. Do NOT generate audio inside Blender. Do NOT depend on external audio files. Before saving, verify that scene.camera is not None. The script MUST save the Blender scene using bpy.ops.wm.save_as_mainfile(filepath='/tmp/diboo_story_scene.blend'). After saving, verify that the file exists using Python standard library os.path.exists. At the end print exactly these diagnostic messages: DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION, BLENDER SCENE READY. The script must not render anything itself. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("request.json")
          data = json.loads(
              p.read_text(encoding="utf-8")
          )

          assert data["model"]
          assert data["input"]

          p.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

          SUCCESS=0

          for ATTEMPT in $(seq 1 "${GEMINI_MAX_ATTEMPTS}"); do

            echo "===== GEMINI ATTEMPT ${ATTEMPT}/${GEMINI_MAX_ATTEMPTS} ====="

            set +e

            RESPONSE="$(
              curl -sS \
                --connect-timeout 20 \
                --max-time 180 \
                -w '\n__HTTP_STATUS__:%{http_code}' \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -X POST \
                "https://generativelanguage.googleapis.com/v1beta/interactions" \
                -d @request.json
            )"

            CURL_EXIT=$?

            set -e

            HTTP_STATUS="$(
              printf '%s\n' "${RESPONSE}" |
              sed -n 's/^__HTTP_STATUS__://p' |
              tail -n 1
            )"

            BODY="$(
              printf '%s\n' "${RESPONSE}" |
              sed '/^__HTTP_STATUS__:/d'
            )"

            printf '%s\n' "${BODY}" > gemini_response.json

            if [[ "${CURL_EXIT}" -eq 0 && "${HTTP_STATUS}" == "200" ]]; then

              if python3 - <<'PY'
          import json

          with open(
              "gemini_response.json",
              encoding="utf-8"
          ) as f:
              x = json.load(f)

          raise SystemExit(
              0 if "error" not in x else 1
          )
          PY
              then
                SUCCESS=1
                break
              fi

            fi

            echo "Gemini request failed."
            echo "curl=${CURL_EXIT}"
            echo "http=${HTTP_STATUS:-unknown}"

            if grep -qE \
              '"code": ?(429|500|502|503|504)|"status": ?"UNAVAILABLE"|rate.?limit|temporarily unavailable' \
              gemini_response.json
            then

              sleep_seconds=$((ATTEMPT * ATTEMPT * 10))

              echo "Retryable Gemini error."
              echo "Sleeping ${sleep_seconds}s."

              sleep "${sleep_seconds}"

              continue
            fi

            cat gemini_response.json
            exit 1

          done

          if [[ "${SUCCESS}" -ne 1 ]]; then
            cat gemini_response.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path(
                  "gemini_response.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          texts = []

          def walk(value):
              if isinstance(value, dict):

                  if (
                      value.get("type") == "text"
                      and isinstance(
                          value.get("text"),
                          str
                      )
                  ):
                      texts.append(
                          value["text"]
                      )

                  for v in value.values():
                      walk(v)

              elif isinstance(value, list):

                  for v in value:
                      walk(v)

          walk(response)

          output = max(
              (
                  x.strip()
                  for x in texts
                  if x.strip()
              ),
              key=len,
              default=""
          )

          if not output:
              raise RuntimeError(
                  "Gemini response contained no text model output."
              )

          Path(
              "gemini_model_output.txt"
          ).write_text(
              output,
              encoding="utf-8"
          )

          print(
              "Gemini model output captured:",
              len(output),
              "characters"
          )
          PY

      # ============================================================
      # PACKAGE VALIDATION
      # ============================================================

      - name: Parse and validate generated package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > validate_package.py <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          raw = Path(
              "gemini_model_output.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          def clean(s):
              s = s.strip()

              if s.startswith("```json"):
                  s = s[7:]

              elif s.startswith("```"):
                  s = s[3:]

              if s.rstrip().endswith("```"):
                  s = s.rstrip()[:-3]

              return s.strip()

          def extract_object(s):
              s = clean(s)

              try:
                  return json.loads(s)
              except json.JSONDecodeError:
                  pass

              start = s.find("{")

              if start < 0:
                  raise ValueError(
                      "No JSON object found."
                  )

              depth = 0
              in_string = False
              escaped = False

              for i in range(
                  start,
                  len(s)
              ):

                  ch = s[i]

                  if in_string:

                      if escaped:
                          escaped = False

                      elif ch == "\\":
                          escaped = True

                      elif ch == '"':
                          in_string = False

                      continue

                  if ch == '"':
                      in_string = True

                  elif ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          candidate = s[
                              start:i + 1
                          ]

                          return json.loads(
                              candidate
                          )

              raise ValueError(
                  "Could not find a complete valid JSON object."
              )

          try:

              generated = extract_object(raw)

              if not isinstance(
                  generated,
                  dict
              ):
                  raise RuntimeError(
                      "Generated package must be a JSON object."
                  )

              if set(generated) != {
                  "story",
                  "blender_script"
              }:
                  raise RuntimeError(
                      "Top-level fields must be exactly story and blender_script."
                  )

              story = generated["story"]
              script = generated["blender_script"]

              if not isinstance(
                  story,
                  dict
              ):
                  raise RuntimeError(
                      "story must be an object."
                  )

              if (
                  not isinstance(
                      script,
                      str
                  )
                  or not script.strip()
              ):
                  raise RuntimeError(
                      "blender_script must be a non-empty string."
                  )

              required = {
                  "title",
                  "description",
                  "hashtags",
                  "duration_target",
                  "language",
                  "hook",
                  "visual_theme",
                  "music",
                  "scenes"
              }

              missing = required - set(story)

              if missing:
                  raise RuntimeError(
                      f"Story missing fields: {sorted(missing)}"
                  )

              duration = story[
                  "duration_target"
              ]

              if isinstance(
                  duration,
                  bool
              ):
                  raise RuntimeError(
                      "duration_target cannot be boolean."
                  )

              if isinstance(
                  duration,
                  str
              ):

                  m = re.fullmatch(
                      r"\s*(\d+)\s*",
                      duration
                  )

                  if not m:
                      raise RuntimeError(
                          "duration_target must be an integer."
                      )

                  duration = int(
                      m.group(1)
                  )

              elif not isinstance(
                  duration,
                  int
              ):
                  raise RuntimeError(
                      "duration_target must be an integer."
                  )

              if not 40 <= duration <= 60:
                  raise RuntimeError(
                      f"duration_target {duration} is outside 40-60."
                  )

              story["duration_target"] = duration

              if str(
                  story["language"]
              ).lower() != "en":
                  raise RuntimeError(
                      "language must be en."
                  )

              if (
                  not isinstance(
                      story["hashtags"],
                      list
                  )
                  or not story["hashtags"]
              ):
                  raise RuntimeError(
                      "hashtags must be a non-empty list."
                  )

              if not isinstance(
                  story["visual_theme"],
                  dict
              ):
                  raise RuntimeError(
                      "visual_theme must be an object."
                  )

              if not isinstance(
                  story["music"],
                  dict
              ):
                  raise RuntimeError(
                      "music must be an object."
                  )

              scenes = story["scenes"]

              if (
                  not isinstance(
                      scenes,
                      list
                  )
                  or not scenes
              ):
                  raise RuntimeError(
                      "scenes must be a non-empty list."
                  )

              scene_fields = {
                  "duration",
                  "description",
                  "camera",
                  "action",
                  "emotion",
                  "visual_transition",
                  "sfx",
                  "music"
              }

              total = 0

              for idx, scene in enumerate(
                  scenes,
                  1
              ):

                  if not isinstance(
                      scene,
                      dict
                  ):
                      raise RuntimeError(
                          f"Scene {idx} must be an object."
                      )

                  missing = (
                      scene_fields - set(scene)
                  )

                  if missing:
                      raise RuntimeError(
                          f"Scene {idx} missing {sorted(missing)}"
                      )

                  raw_d = scene["duration"]

                  if isinstance(
                      raw_d,
                      bool
                  ):
                      raise RuntimeError(
                          f"Scene {idx} duration cannot be boolean."
                      )

                  if isinstance(
                      raw_d,
                      str
                  ):

                      m = re.fullmatch(
                          r"\s*(\d+)\s*",
                          raw_d
                      )

                      if not m:
                          raise RuntimeError(
                              f"Scene {idx} duration must be an integer."
                          )

                      d = int(
                          m.group(1)
                      )

                  elif isinstance(
                      raw_d,
                      int
                  ):
                      d = raw_d

                  else:
                      raise RuntimeError(
                          f"Scene {idx} duration must be an integer."
                      )

                  if d <= 0:
                      raise RuntimeError(
                          f"Scene {idx} duration must be positive."
                      )

                  scene["duration"] = d
                  total += d

                  for forbidden in (
                      "narration",
                      "voice",
                      "subtitle",
                      "subtitles"
                  ):

                      if forbidden in scene:
                          raise RuntimeError(
                              f"Scene {idx} contains forbidden field {forbidden}."
                          )

              for forbidden in (
                  "narration",
                  "voice",
                  "subtitle",
                  "subtitles"
              ):

                  if forbidden in story:
                      raise RuntimeError(
                          f"Story contains forbidden field {forbidden}."
                      )

              if abs(
                  total - duration
              ) > 3:
                  raise RuntimeError(
                      f"Scene total {total}s differs from target {duration}s by more than 3s."
                  )

              script = clean(script)

              if script.startswith(
                  "python\n"
              ):
                  script = script[7:].lstrip()

              Path(
                  "story.json"
              ).write_text(
                  json.dumps(
                      story,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              Path(
                  "blender_scene/blender_scene.py"
              ).write_text(
                  script + "\n",
                  encoding="utf-8"
              )

              Path(
                  "/tmp/diboo_duration.txt"
              ).write_text(
                  str(duration),
                  encoding="utf-8"
              )

              print(
                  "STORY PACKAGE VALIDATION: PASSED"
              )

              print(
                  "TITLE:",
                  story["title"]
              )

              print(
                  "DURATION:",
                  duration
              )

              print(
                  "SCENES:",
                  len(scenes)
              )

              print(
                  "SCENE TOTAL:",
                  total
              )

          except Exception as exc:

              Path(
                  "/tmp/package_validation_error.txt"
              ).write_text(
                  f"{type(exc).__name__}: {exc}",
                  encoding="utf-8"
              )

              print(
                  f"PACKAGE_VALIDATION_FAILED: {type(exc).__name__}: {exc}"
              )

              sys.exit(10)
          PY

          MAX_PACKAGE_REPAIRS=3
          PACKAGE_REPAIR=0

          while true; do

            rm -f \
              story.json \
              blender_scene/blender_scene.py \
              /tmp/diboo_duration.txt

            set +e

            python3 validate_package.py

            VALIDATE_EXIT=$?

            set -e

            if [[ "${VALIDATE_EXIT}" -eq 0 ]]; then
              break
            fi

            if [[ "${PACKAGE_REPAIR}" -ge "${MAX_PACKAGE_REPAIRS}" ]]; then

              echo "Maximum Gemini package repairs reached."

              cat \
                /tmp/package_validation_error.txt \
                || true

              exit 1
            fi

            PACKAGE_REPAIR=$((PACKAGE_REPAIR + 1))

            echo "Malformed/invalid Gemini package."
            echo "Repair ${PACKAGE_REPAIR}/${MAX_PACKAGE_REPAIRS}"

            python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path(
              "gemini_model_output.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          error = Path(
              "/tmp/package_validation_error.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          if len(raw) > 50000:
              raw = raw[:50000]

          prompt = f"""Repair the following Project_Diboo model output into ONE valid JSON object.

          Return ONLY valid JSON. No Markdown. No code fences. No explanation.

          The output MUST have exactly these top-level fields:
          - story
          - blender_script

          story MUST contain exactly:
          title, description, hashtags, duration_target, language, hook, visual_theme, music, scenes

          duration_target must be an integer from 40 to 60.
          language must be "en".
          visual_theme must contain style, palette, lighting, animation, camera.
          music must contain style, mood, intensity, instrumentation, timing.
          scenes must be a non-empty list.
          Every scene must contain:
          duration, description, camera, action, emotion, visual_transition, sfx, music
          Scene duration must be a positive integer.
          Scene total must be within 3 seconds of duration_target.
          Do not include narration, voice, subtitle or subtitles fields.
          blender_script must be a JSON string containing a complete standalone Blender 4.0.2 Python script.

          The Blender script must:
          - import bpy
          - use stable Blender 4.0.2 APIs
          - use bpy.ops.mesh.primitive_plane_add for planes
          - never use bpy.ops.mesh.create_plane
          - never access material node inputs by numeric indexes
          - use named node sockets
          - use RGBA color tuples
          - use numeric floats where required
          - create the camera before animation
          - set scene.camera
          - create at least one light
          - use scene.render.engine = 'BLENDER_EEVEE'
          - never use BLENDER_EEVEE_NEXT
          - use 1080x1920 at 24 FPS
          - avoid simulations, particles, geometry nodes, volumetrics, cloth, smoke, fire and rigid bodies
          - use expressive animated characters and deliberate camera movement
          - use no external assets, downloads, network, audio, narration or subtitles
          - save /tmp/diboo_story_scene.blend
          - verify the saved file with os.path.exists
          - print the required DIBOO diagnostics
          - never render the animation itself

          VALIDATION ERROR:
          {error}

          BROKEN MODEL OUTPUT:
          {raw}
          """

          Path(
              "package_repair_request.json"
          ).write_text(
              json.dumps(
                  {
                      "model":
                          "gemini-3.5-flash-lite",
                      "input":
                          prompt
                  },
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

            set +e

            RESPONSE="$(
              curl -sS \
                --connect-timeout 20 \
                --max-time 180 \
                -w '\n__HTTP_STATUS__:%{http_code}' \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -X POST \
                "https://generativelanguage.googleapis.com/v1beta/interactions" \
                -d @package_repair_request.json
            )"

            CURL_EXIT=$?

            set -e

            HTTP_STATUS="$(
              printf '%s\n' "${RESPONSE}" |
              sed -n 's/^__HTTP_STATUS__://p' |
              tail -n 1
            )"

            BODY="$(
              printf '%s\n' "${RESPONSE}" |
              sed '/^__HTTP_STATUS__:/d'
            )"

            printf '%s\n' "${BODY}" \
              > package_repair_response.json

            if [[ "${CURL_EXIT}" -ne 0 || "${HTTP_STATUS}" != "200" ]]; then

              echo "Gemini package repair failed."

              cat package_repair_response.json

              exit 1
            fi

            python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path(
                  "package_repair_response.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          texts = []

          def walk(x):

              if isinstance(x, dict):

                  if (
                      x.get("type") == "text"
                      and isinstance(
                          x.get("text"),
                          str
                      )
                  ):
                      texts.append(
                          x["text"]
                      )

                  for v in x.values():
                      walk(v)

              elif isinstance(x, list):

                  for v in x:
                      walk(v)

          walk(response)

          text = max(
              (
                  x.strip()
                  for x in texts
                  if x.strip()
              ),
              key=len,
              default=""
          )

          if not text:
              raise RuntimeError(
                  "Gemini package repair response contained no text."
              )

          Path(
              "gemini_model_output.txt"
          ).write_text(
              text,
              encoding="utf-8"
          )
          PY

          done

          python3 -m py_compile \
            blender_scene/blender_scene.py \
            || echo \
              "Initial Blender syntax check failed; pre-execution repair stage will fix it."

      # ============================================================
      # BLENDER SYNTAX REPAIR
      # ============================================================

      - name: Repair Blender script before execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MAX_REPAIRS="${BLENDER_MAX_REPAIRS}"
          REPAIR=0

          while true; do

            if python3 -m py_compile \
              blender_scene/blender_scene.py \
              2> blender_scene/py_compile_error.log
            then

              echo "BLENDER PYTHON SYNTAX: PASSED"

              break
            fi

            if [[ "${REPAIR}" -ge "${MAX_REPAIRS}" ]]; then

              echo "Maximum pre-execution syntax repairs reached."

              cat \
                blender_scene/py_compile_error.log

              exit 1
            fi

            REPAIR=$((REPAIR + 1))

            echo \
              "Pre-execution Blender repair ${REPAIR}/${MAX_REPAIRS}"

            python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path(
              "blender_scene/blender_scene.py"
          ).read_text(
              encoding="utf-8"
          )

          error = Path(
              "blender_scene/py_compile_error.log"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )


      # ============================================================

      - name: Create Project_Diboo ambient audio
        run: |
          set -e

          echo "================================"
          echo "DIBOO AMBIENT AUDIO GENERATION"
          echo "================================"

          DURATION=$(cat \
            /tmp/diboo_duration.txt)

          rm -rf \
            /tmp/diboo_audio

          mkdir -p \
            /tmp/diboo_audio

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:

              story = json.load(f)

          scenes = story["scenes"]

          current = 0

          print("")
          print("Generating scene-adaptive ambient score...")

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              duration = int(
                  scene["duration"]
              )

              music = scene.get(
                  "music",
                  {}
              )

              mood = str(
                  music
              ).lower()

              output = Path(
                  f"/tmp/diboo_audio/"
                  f"scene_{index:02d}_music.wav"
              )

              if any(
                  word in mood
                  for word in [
                      "sad",
                      "lonely",
                      "emotional",
                      "melancholy"
                  ]
              ):

                  frequencies = \
                      "196+246.94+293.66"

              elif any(
                  word in mood
                  for word in [
                      "tension",
                      "danger",
                      "fear",
                      "suspense"
                  ]
              ):

                  frequencies = \
                      "164.81+207.65+246.94"

              elif any(
                  word in mood
                  for word in [
                      "happy",
                      "joy",
                      "playful",
                      "fun",
                      "cute"
                  ]
              ):

                  frequencies = \
                      "261.63+329.63+392.00"

              elif any(
                  word in mood
                  for word in [
                      "hope",
                      "warm",
                      "comfort",
                      "relief"
                  ]
              ):

                  frequencies = \
                      "220+277.18+329.63"

              else:

                  frequencies = \
                      "220+277.18+329.63"

              expression = (
                  "0.025*sin(2*PI*"
                  f"({frequencies})/3*t)"
                  "+0.012*sin(2*PI*110*t)"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-f",
                      "lavfi",
                      "-i",
                      (
                          f"aevalsrc="
                          f"{expression}:"
                          f"s=48000:"
                          f"d={duration}"
                      ),
                      "-ar",
                      "48000",
                      "-ac",
                      "2",
                      str(output)
                  ],
                  check=True
              )

              current += duration

              print(
                  f"Scene {index}: "
                  f"{duration}s"
              )

          concat_file = Path(
              "/tmp/diboo_audio/"
              "music_concat.txt"
          )

          with concat_file.open(
              "w",
              encoding="utf-8"
          ) as f:

              for index in range(
                  1,
                  len(scenes) + 1
              ):

                  f.write(
                      "file "
                      f"'/tmp/diboo_audio/"
                      f"scene_{index:02d}_music.wav'\n"
                  )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "/tmp/diboo_audio/music.wav"
              ],
              check=True
          )

          print("")
          print(
              "AMBIENT MUSIC CREATED"
          )
          PY

          # --------------------------------------------------------
          # PROCEDURAL SFX
          # --------------------------------------------------------

          echo ""
          echo "Generating procedural SFX..."

          ffmpeg \
            -y \
            -f lavfi \
            -i "aevalsrc=0.035*sin(2*PI*(600-450*t)*t)*exp(-4*t):s=48000:d=0.8" \
            -ar 48000 \
            -ac 2 \
            /tmp/diboo_audio/sfx.wav

          test -s \
            /tmp/diboo_audio/sfx.wav

          # --------------------------------------------------------
          # MIX MUSIC + SFX
          # --------------------------------------------------------

          echo ""
          echo "Mixing ambient soundtrack..."

          ffmpeg \
            -y \
            -i /tmp/diboo_audio/music.wav \
            -i /tmp/diboo_audio/sfx.wav \
            -filter_complex "\
          [0:a]volume=0.22[music];\
          [1:a]volume=0.10,aloop=loop=-1:size=38400[sfx];\
          [music][sfx]amix=inputs=2:duration=first:dropout_transition=2,\
          loudnorm=I=-18:TP=-2:LRA=11\
          [out]" \
            -map "[out]" \
            -t "$DURATION" \
            -ar 48000 \
            -ac 2 \
            -c:a aac \
            -b:a 128k \
            /tmp/diboo_audio_track.m4a

          test -s \
            /tmp/diboo_audio_track.m4a

          echo ""
          echo "================================"
          echo "DIBOO AMBIENT AUDIO TRACK READY"
          echo "NO VOICE"
          echo "NO ROBOTIC NARRATION"
          echo "NO SUBTITLES"
          echo "================================"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,codec_type,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            /tmp/diboo_audio_track.m4a


      # ============================================================

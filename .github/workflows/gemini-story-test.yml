name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      - name: Generate structured story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "===== DIBOO STORY GENERATOR ====="

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.8-flash",
            "input": "Create one original 3D cartoon YouTube Short story for the Project_Diboo channel. The story must be highly visual and easy to understand without audio. Use simple objects, animals, vehicles, or characters. Do not copy any copyrighted character or franchise. Target approximately 50 seconds. The narration must be in English. Structure the story with a strong hook, situation, problem, action, resolution, and payoff. Include visual descriptions, camera movement, character or object actions, and simple sound-effect suggestions.",
            "response_format": {
              "type": "text",
              "mime_type": "application/json",
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "duration_target": {
                    "type": "integer"
                  },
                  "language": {
                    "type": "string"
                  },
                  "hook": {
                    "type": "string"
                  },
                  "narration": {
                    "type": "string"
                  },
                  "scenes": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "duration": {
                          "type": "integer"
                        },
                        "description": {
                          "type": "string"
                        },
                        "camera": {
                          "type": "string"
                        },
                        "action": {
                          "type": "string"
                        },
                        "sfx": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "duration",
                        "description",
                        "camera",
                        "action",
                        "sfx"
                      ]
                    }
                  }
                },
                "required": [
                  "title",
                  "duration_target",
                  "language",
                  "hook",
                  "narration",
                  "scenes"
                ]
              }
            }
          }
          JSON

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -s \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|"code": ?"service_unavailable"'; then
                echo ""
                echo "Gemini is temporarily unavailable."
                echo "Waiting 15 seconds before retry..."
                sleep 15
                continue
              fi

              echo ""
              echo "===== GEMINI API ERROR ====="
              exit 1
            fi

            echo ""
            echo "===== GEMINI RESPONSE RECEIVED ====="
            break
          done

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo ""
            echo "===== GEMINI FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

      - name: Extract and validate JSON
        run: |
          set -e

          python3 - <<'PY'
          import json
          import sys

          with open("gemini_response.json", "r", encoding="utf-8") as f:
              response = json.load(f)

          output_text = response.get("output_text")

          if not output_text:
              raise RuntimeError(
                  "Gemini response did not contain output_text."
              )

          story = json.loads(output_text)

          required_fields = [
              "title",
              "duration_target",
              "language",
              "hook",
              "narration",
              "scenes"
          ]

          for field in required_fields:
              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language is not English."
              )

          duration = story["duration_target"]

          if not 40 <= duration <= 60:
              raise RuntimeError(
                  f"Duration target is invalid: {duration}"
              )

          if not isinstance(story["scenes"], list):
              raise RuntimeError(
                  "Scenes must be a list."
              )

          if len(story["scenes"]) == 0:
              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx"
          ]

          for index, scene in enumerate(
              story["scenes"],
              start=1
          ):
              for field in scene_fields:
                  if field not in scene:
                      raise RuntimeError(
                          f"Scene {index} is missing: {field}"
                      )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("================================")
          print("DIBOO STORY VALIDATION: PASSED")
          print("================================")
          print("")
          print("Title:", story["title"])
          print(
              "Duration:",
              story["duration_target"],
              "seconds"
          )
          print("Language:", story["language"])
          print(
              "Scenes:",
              len(story["scenes"])
          )
          print("")
          print("story.json created successfully.")
          PY

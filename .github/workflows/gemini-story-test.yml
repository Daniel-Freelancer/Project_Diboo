name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE STORY WITH GEMINI FLASH
      # ============================================================

      - name: Generate structured story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI FLASH STORY GENERATOR"
          echo "================================"

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.7-flash",
            "input": "Create one original 3D cartoon YouTube Short story for the Project_Diboo channel. The story must be highly visual and easy to understand even without audio. Use simple objects, animals, vehicles, machines, or simple characters. Do not copy any copyrighted character, franchise, company, or protected visual style. The story must target approximately 50 seconds and must remain between 40 and 60 seconds. The narration must be in English. The story structure should contain: HOOK from 0-5 seconds, SITUATION from 5-12 seconds, PROBLEM from 12-25 seconds, ACTION from 25-40 seconds, RESOLUTION from 40-50 seconds, and PAYOFF from 50-55 seconds. The exact timing may vary while remaining between 40 and 60 seconds. Create a strong visual hook, clear cause-and-effect actions, dynamic camera movements, simple visual storytelling, and simple SFX suggestions. Return ONLY valid JSON with exactly these top-level fields: title, duration_target, language, hook, narration, scenes. duration_target MUST be a plain integer containing only the number of seconds, for example 53, never a string and never include the word seconds. Each scene must contain: duration, description, camera, action, sfx. Scene duration MUST also be a plain integer. The language field must be en."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI FLASH ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -s \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo ""
                echo "Gemini Flash is temporarily unavailable."
                echo "Waiting 20 seconds before retry..."
                sleep 20
                continue
              fi

              echo ""
              echo "===== GEMINI API ERROR ====="
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "===== GEMINI FLASH FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo ""
          echo "===== GEMINI FLASH RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT MODEL OUTPUT
      # ============================================================

      - name: Extract generated story
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          print("")
          print("================================")
          print("EXTRACTING GEMINI STORY")
          print("================================")

          story_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get("text", "").strip()

                      if text:
                          story_text = text
                          break

              if story_text:
                  break

          if not story_text:

              print("")
              print("===== GEMINI RESPONSE STRUCTURE =====")

              print(
                  json.dumps(
                      response,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise RuntimeError(
                  "Could not find model output text."
              )

          print("")
          print("===== MODEL OUTPUT FOUND =====")
          print(story_text)

          if story_text.startswith("```json"):
              story_text = story_text[7:]

          elif story_text.startswith("```"):
              story_text = story_text[3:]

          if story_text.endswith("```"):
              story_text = story_text[:-3]

          story_text = story_text.strip()

          try:
              story = json.loads(story_text)

          except json.JSONDecodeError as error:

              print("")
              print("===== INVALID JSON =====")
              print(story_text)

              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("===== STORY JSON CREATED =====")

          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY


      # ============================================================
      # 3. VALIDATE PROJECT_DIBOO STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "duration_target",
              "language",
              "hook",
              "narration",
              "scenes"
          ]

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          raw_duration = story["duration_target"]

          if isinstance(raw_duration, bool):

              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          elif isinstance(raw_duration, int):

              duration = raw_duration

          elif isinstance(raw_duration, float):

              duration = int(raw_duration)

          elif isinstance(raw_duration, str):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:

                  raise RuntimeError(
                      "Could not extract duration from duration_target."
                  )

              duration = int(
                  match.group(0)
              )

          else:

              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          print("")
          print("Normalized duration:")
          print(
              duration,
              "seconds"
          )

          if not 40 <= duration <= 60:

              raise RuntimeError(
                  f"Invalid duration: {duration}. "
                  "Must be between 40 and 60 seconds."
              )

          scenes = story["scenes"]

          if not isinstance(
              scenes,
              list
          ):

              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) == 0:

              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx"
          ]

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(
                  scene,
                  dict
              ):

                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:

                      raise RuntimeError(
                          f"Scene {index} is missing field: {field}"
                      )

              scene_duration = scene["duration"]

              if isinstance(
                  scene_duration,
                  bool
              ):

                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              elif isinstance(
                  scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      scene_duration
                  )

                  if not match:

                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene["duration"] = int(
                      match.group(0)
                  )

              elif isinstance(
                  scene_duration,
                  (int, float)
              ):

                  scene["duration"] = int(
                      scene_duration
                  )

              else:

                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("================================")
          print("DIBOO STORY VALIDATION: PASSED")
          print("================================")
          print("")

          print("TITLE:")
          print(
              story["title"]
          )

          print("")

          print("DURATION:")
          print(
              story["duration_target"],
              "seconds"
          )

          print("")

          print("LANGUAGE:")
          print(
              story["language"]
          )

          print("")

          print("SCENES:")
          print(
              len(scenes)
          )

          print("")

          print("story.json is valid.")
          PY


      # ============================================================
      # 4. GENERATE BLENDER PYTHON SCRIPT WITH GEMINI
      # ============================================================

      - name: Generate Blender Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI BLENDER SCRIPT GENERATOR"
          echo "================================"

          mkdir -p blender_scene

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          prompt = r"""
          You are the procedural Blender scene generator for Project_Diboo.

          Convert the supplied story.json into ONE complete Python script
          that can be executed by Blender 4.0.2 in background mode.

          IMPORTANT OUTPUT RULES:

          - Return ONLY Python code.
          - Do NOT return Markdown.
          - Do NOT use ```python.
          - Do NOT explain anything.
          - The result must be a complete standalone Blender Python script.
          - Use bpy.
          - Do not require external Blender addons.
          - Do not require external assets.
          - Everything must be generated procedurally.
          - Do not download anything.
          - Do not use external files.

          BLENDER VERSION:

          Blender 4.0.2

          RENDER ENGINE:

          Use exactly:

          scene.render.engine = 'BLENDER_EEVEE'

          Do NOT use BLENDER_EEVEE_NEXT.

          SCENE:

          Create a simple but visually clear 3D cartoon scene based on
          the story.

          The script must create:

          - environment
          - ground
          - required story objects
          - simple procedural characters if needed
          - materials
          - camera
          - lighting
          - animation

          CAMERA:

          The final composition must be vertical.

          Use:

          resolution_x = 1080
          resolution_y = 1920
          resolution_percentage = 100

          FPS:

          24

          ANIMATION:

          The story duration is supplied in story.json.

          Convert the duration into frames using 24 FPS.

          Set:

          scene.frame_start = 1
          scene.frame_end = <calculated final frame>

          Use Blender keyframes for animation.

          ROBUSTNESS:

          - Always create an active camera.
          - Always create at least one light.
          - Always create geometry.
          - Avoid simulations.
          - Avoid physics.
          - Avoid external dependencies.
          - Avoid UI-only bpy operators.
          - The script must work with:

            blender -b --python blender_scene.py

          Start by clearing the default scene.

          Use simple primitives such as:

          cubes
          spheres
          cylinders
          cones
          planes

          Prefer reliability and fast rendering over visual complexity.

          The script must save the resulting Blender file to:

          /tmp/diboo_story_scene.blend

          At the end print:

          DIBOO BLENDER SCENE CREATED

          STORY TITLE: <story title>

          TOTAL FRAMES: <number>

          FPS: 24

          RESOLUTION: 1080x1920

          BLENDER SCENE READY

          STORY JSON:
          """

          full_prompt = (
              prompt
              + "\n"
              + json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          request = {
              "model": "gemini-3.7-flash",
              "input": full_prompt
          }

          Path(
              "blender_scene/request.json"
          ).write_text(
              json.dumps(
                  request,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print("")
          print("===== BLENDER SCRIPT REQUEST CREATED =====")
          print("")
          print("Story:")
          print(story["title"])
          print("")
          print("Scenes:")
          print(len(story["scenes"]))
          PY

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do

            echo ""
            echo "===== BLENDER SCRIPT GEMINI ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -s \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @blender_scene/request.json)

            echo "$RESPONSE" \
              > blender_scene/gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat blender_scene/gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE \
                '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then

                echo ""
                echo "Gemini is temporarily unavailable."
                echo "Waiting 30 seconds before retry..."

                sleep 30
                continue
              fi

              echo ""
              echo "===== GEMINI BLENDER SCRIPT API ERROR ====="
              exit 1
            fi

            SUCCESS=true
            break

          done

          if [ "$SUCCESS" != "true" ]; then

            echo ""
            echo "===== GEMINI BLENDER SCRIPT FAILED AFTER 5 ATTEMPTS ====="
            exit 1

          fi

          echo ""
          echo "===== EXTRACTING BLENDER SCRIPT ====="

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "blender_scene/gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          script_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:

                          script_text = text
                          break

              if script_text:
                  break

          if not script_text:

              print("")
              print("===== GEMINI RESPONSE STRUCTURE =====")

              print(
                  json.dumps(
                      response,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise RuntimeError(
                  "Gemini response did not contain Blender script output."
              )

          if script_text.startswith("```python"):

              script_text = script_text[
                  len("```python"):
              ]

          elif script_text.startswith("```"):

              script_text = script_text[3:]

          if script_text.rstrip().endswith("```"):

              script_text = (
                  script_text.rstrip()[:-3]
              )

          script_text = script_text.strip()

          if not script_text:

              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          output = Path(
              "blender_scene/blender_scene.py"
          )

          output.write_text(
              script_text,
              encoding="utf-8"
          )

          print("")
          print("================================")
          print("BLENDER SCRIPT GENERATED")
          print("================================")

          print("")
          print("File:")
          print(output)

          print("")
          print("Size:")
          print(
              output.stat().st_size,
              "bytes"
          )
          PY

          echo ""
          echo "===== VALIDATING BLENDER PYTHON SYNTAX ====="

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "================================"
          echo "BLENDER SCRIPT VALIDATION: PASSED"
          echo "================================"


      # ============================================================
      # 5. RENDER ONE FRAME FROM GENERATED BLENDER SCRIPT
      # ============================================================

      - name: Render Blender story test
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER RENDER TEST"
          echo "================================"

          if command -v blender >/dev/null 2>&1; then

            echo ""
            echo "Blender already available:"
            blender --version

          else

            echo ""
            echo "Blender not found."
            echo "Installing Blender..."

            sudo apt-get update

            sudo apt-get install -y \
              blender \
              libtbb12 \
              libegl1 \
              libgl1 \
              libglib2.0-0

            echo ""
            echo "Blender installation completed."

            blender --version

          fi

          mkdir -p /tmp/diboo_render

          echo ""
          echo "Starting Blender with generated script..."

          blender \
            -b \
            --python blender_scene/blender_scene.py \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -f 1

          echo ""
          echo "================================"
          echo "BLENDER RENDER FINISHED"
          echo "================================"

          ls -lh /tmp/diboo_render


      # ============================================================
      # 6. VERIFY RENDER
      # ============================================================

      - name: Verify Blender render
        run: |
          set -e

          echo "================================"
          echo "DIBOO RENDER VERIFICATION"
          echo "================================"

          FILE_COUNT=$(find /tmp/diboo_render \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "PNG FILE COUNT:"
          echo "$FILE_COUNT"

          if [ "$FILE_COUNT" -lt 1 ]; then

            echo ""
            echo "ERROR: Blender did not produce a PNG."

            exit 1

          fi

          echo ""
          echo "RENDER FILE:"

          find /tmp/diboo_render \
            -type f \
            -name "*.png" \
            -print

          echo ""

          echo "================================"
          echo "DIBOO BLENDER TEST: PASSED"
          echo "================================"

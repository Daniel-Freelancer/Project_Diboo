          espeak-ng --version | head -n 1

          echo ""
          echo "DIBOO AUDIO TOOLS READY"


      # ============================================================
      # 11. PREPARE NARRATION + MUSIC + SFX + SUBTITLES
      # ============================================================

      - name: Prepare Project_Diboo audio and subtitles
        run: |
          set -e

          echo "================================"
          echo "DIBOO AUDIO + SUBTITLE PIPELINE"
          echo "================================"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          title = str(
              story.get(
                  "title",
                  "Project_Diboo"
              )
          ).strip()

          narration = str(
              story.get(
                  "narration",
                  ""
              )
          ).strip()

          if not narration:
              raise RuntimeError(
                  "Narration is empty."
              )

          scenes = story.get(
              "scenes",
              []
          )

          if not scenes:
              raise RuntimeError(
                  "No scenes available for SFX/subtitles."
              )

          Path(
              "/tmp/diboo_title.txt"
          ).write_text(
              title,
              encoding="utf-8"
          )

          Path(
              "/tmp/diboo_narration.txt"
          ).write_text(
              narration,
              encoding="utf-8"
          )

          print("")
          print("TITLE:")
          print(title)

          print("")
          print("NARRATION:")
          print(narration)

          print("")
          print("SCENE COUNT:")
          print(len(scenes))

          print("")
          print("Generating subtitle timing from narration/scenes...")

          words = narration.split()

          if not words:
              raise RuntimeError(
                  "Narration contains no words."
              )

          duration = int(
              story["duration_target"]
          )

          total_words = len(words)

          subtitle_entries = []

          scene_start = 0.0

          for scene_index, scene in enumerate(
              scenes,
              start=1
          ):

              scene_duration = int(
                  scene["duration"]
              )

              scene_end = min(
                  float(duration),
                  scene_start + scene_duration
              )

              start_ratio = (
                  scene_start / max(duration, 1)
              )

              end_ratio = (
                  scene_end / max(duration, 1)
              )

              start_word = int(
                  start_ratio * total_words
              )

              end_word = int(
                  end_ratio * total_words
              )

              if scene_index == len(scenes):
                  end_word = total_words

              chunk = words[
                  start_word:end_word
              ]

              if not chunk:
                  scene_start = scene_end
                  continue

              chunk_text = " ".join(
                  chunk
              )

              subtitle_entries.append(
                  (
                      scene_start,
                      scene_end,
                      chunk_text
                  )
              )

              scene_start = scene_end

          if not subtitle_entries:
              subtitle_entries.append(
                  (
                      0.0,
                      float(duration),
                      narration
                  )
              )

          def srt_time(seconds):
              milliseconds = int(
                  round(
                      seconds * 1000
                  )
              )

              hours = milliseconds // 3600000
              milliseconds %= 3600000

              minutes = milliseconds // 60000
              milliseconds %= 60000

              seconds_value = milliseconds // 1000
              milliseconds %= 1000

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{seconds_value:02d},"
                  f"{milliseconds:03d}"
              )

          with open(
              "/tmp/diboo_subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:

              for index, (
                  start,
                  end,
                  text
              ) in enumerate(
                  subtitle_entries,
                  start=1
              ):

                  f.write(
                      f"{index}\n"
                  )

                  f.write(
                      f"{srt_time(start)} --> "
                      f"{srt_time(end)}\n"
                  )

                  f.write(
                      text.strip()
                  )

                  f.write(
                      "\n\n"
                  )

          print("")
          print("SUBTITLE FILE:")
          print("/tmp/diboo_subtitles.srt")

          print("")
          print("SUBTITLE ENTRIES:")
          print(len(subtitle_entries))

          print("")
          print("DIBOO AUDIO + SUBTITLE DATA READY")
          PY

          echo ""
          echo "================================"
          echo "GENERATING NARRATION AUDIO"
          echo "================================"

          espeak-ng \
            -v en-us \
            -s 155 \
            -p 50 \
            -a 165 \
            -f /tmp/diboo_narration.txt \
            -w /tmp/diboo_narration.wav

          test -s /tmp/diboo_narration.wav

          echo ""
          echo "Narration WAV:"
          ls -lh /tmp/diboo_narration.wav

          echo ""
          echo "================================"
          echo "GENERATING BACKGROUND MUSIC"
          echo "================================"

          DURATION=$(python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print(
              int(
                  story["duration_target"]
              )
          )
          PY
          )

          ffmpeg \
            -y \
            -f lavfi \
            -i "sine=frequency=220:sample_rate=48000:duration=${DURATION}" \
            -f lavfi \
            -i "sine=frequency=330:sample_rate=48000:duration=${DURATION}" \
            -filter_complex \
            "[0:a]volume=0.045[a];[1:a]volume=0.030[b];[a][b]amix=inputs=2:duration=longest,afade=t=in:st=0:d=2,afade=t=out:st=$((${DURATION}-3)):d=3" \
            -ac 2 \
            -ar 48000 \
            /tmp/diboo_music.wav

          test -s /tmp/diboo_music.wav

          echo ""
          echo "Music WAV:"
          ls -lh /tmp/diboo_music.wav

          echo ""
          echo "================================"
          echo "GENERATING SFX TRACK"
          echo "================================"

          ffmpeg \
            -y \
            -f lavfi \
            -i "anoisesrc=color=white:amplitude=0.25:sample_rate=48000:duration=${DURATION}" \
            -af "highpass=f=900,lowpass=f=5000,volume=0.018" \
            -ac 2 \
            -ar 48000 \
            /tmp/diboo_sfx_base.wav

          test -s /tmp/diboo_sfx_base.wav

          python3 - <<'PY'
          import json
          import wave
          from pathlib import Path

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          scenes = story["scenes"]

          duration = int(
              story["duration_target"]
          )

          sample_rate = 48000
          total_samples = duration * sample_rate

          output = wave.open(
              "/tmp/diboo_sfx_track.wav",
              "wb"
          )

          output.setnchannels(1)
          output.setsampwidth(2)
          output.setframerate(sample_rate)

          import math
          import struct

          audio = [
              0.0
          ] * total_samples

          current_time = 0.0

          for scene_index, scene in enumerate(
              scenes,
              start=1
          ):

              scene_duration = int(
                  scene["duration"]
              )

              event_time = min(
                  duration - 0.1,
                  current_time + 0.25
              )

              start_sample = int(
                  event_time * sample_rate
              )

              tone_duration = 0.12

              tone_samples = int(
                  tone_duration * sample_rate
              )

              frequency = 280 + (
                  (scene_index % 5) * 90
              )

              for i in range(
                  tone_samples
              ):

                  position = (
                      start_sample + i
                  )

                  if position >= total_samples:
                      break

                  envelope = max(
                      0.0,
                      1.0 - (
                          i / tone_samples
                      )
                  )

                  value = (
                      math.sin(
                          2.0 *
                          math.pi *
                          frequency *
                          i /
                          sample_rate
                      )
                      *
                      0.10
                      *
                      envelope
                  )

                  audio[position] += value

              current_time += scene_duration

          frames = bytearray()

          for value in audio:

              value = max(
                  -1.0,
                  min(
                      1.0,
                      value
                  )
              )

              frames.extend(
                  struct.pack(
                      "<h",
                      int(
                          value *
                          32767
                      )
                  )
              )

          output.writeframes(
              bytes(frames)
          )

          output.close()

          print("")
          print("SFX EVENTS GENERATED:")
          print(len(scenes))
          PY

          test -s /tmp/diboo_sfx_track.wav

          echo ""
          echo "SFX WAV:"
          ls -lh /tmp/diboo_sfx_track.wav

          echo ""
          echo "================================"
          echo "DIBOO AUDIO ASSETS READY"
          echo "================================"



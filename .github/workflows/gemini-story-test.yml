name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI 3.5 FLASH-LITE GENERATOR"
          echo "================================"

          mkdir -p blender_scene
          mkdir -p logs

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the story and Blender procedural generation engine for Project_Diboo. Generate BOTH a structured story and a complete Blender Python script in ONE response. The story is for an original 3D cartoon YouTube Short. It must be highly visual and understandable without audio. Use simple objects, animals, vehicles, machines, or simple characters. Do not copy copyrighted characters, franchises, companies, or protected visual styles. Target approximately 50 seconds and remain between 40 and 60 seconds. Narration language must be English. Story structure: HOOK 0-5 seconds, SITUATION 5-12 seconds, PROBLEM 12-25 seconds, ACTION 25-40 seconds, RESOLUTION 40-50 seconds, PAYOFF 50-55 seconds. Create strong visual storytelling, clear cause and effect, dynamic camera movements, and SFX suggestions. Return ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly: title, duration_target, language, hook, narration, scenes. duration_target MUST be a plain integer. language MUST be en. Every scene MUST contain: duration, description, camera, action, sfx. Scene duration MUST be a plain integer. The blender_script field MUST contain a complete standalone Python script for Blender 4.0.2. The script MUST be conservative, deterministic and reliable. It MUST NOT depend on external files, addons, downloads, textures, fonts, images, sounds or network access. It MUST run correctly in Blender 4.0.2 background mode using: blender -b --python blender_scene.py. The script MUST import bpy and math only unless another Python standard-library module is absolutely necessary. It MUST first clear the default scene using bpy.ops.object.select_all(action='SELECT') and bpy.ops.object.delete(use_global=False). Use only stable Blender 4.0.2 operators. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. Use cubes, spheres, cylinders, cones and planes only. Create materials using bpy.data.materials.new and diffuse_color whenever possible. If using nodes, NEVER access Principled BSDF inputs by numeric indexes. NEVER use inputs[21], inputs[20], inputs[0] or any numeric socket index. Access sockets only by name using node.inputs.get('Base Color'), node.inputs.get('Roughness'), node.inputs.get('Metallic'), node.inputs.get('Specular IOR Level'), node.inputs.get('Alpha'), etc. Color values MUST be 4-value RGBA tuples. Float values MUST be single floats. Create the camera BEFORE creating animation. Set scene.camera = camera. Create at least one light. Use scene.render.engine = 'BLENDER_EEVEE' exactly. NEVER use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100 and 24 FPS. Convert duration_target to frames. Set scene.frame_start = 1 and scene.frame_end accordingly. Keep geometry and lighting simple for fast EEVEE rendering. Avoid simulations, particle systems, geometry nodes, compositing, volumetrics, cloth, smoke, fire, rigid body simulations and expensive modifiers. Prefer simple keyframe animation. Every animated object must already exist before keyframes are inserted. Before saving, verify that scene.camera is not None. The script MUST save the Blender scene using bpy.ops.wm.save_as_mainfile(filepath='/tmp/diboo_story_scene.blend'). After saving, verify that the file exists using Python standard library os.path.exists. At the end print exactly these diagnostic messages: DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION, BLENDER SCENE READY. The script must not render anything itself. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI 3.5 FLASH-LITE ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo ""
                echo "Gemini temporarily unavailable."
                echo "Waiting 20 seconds before retry..."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE '"code": ?429|too_many_requests|Rate limit exceeded'; then
                echo ""
                echo "Gemini rate limit reached."
                echo "Waiting 60 seconds before retry..."
                sleep 60
                continue
              fi

              echo ""
              echo "===== GEMINI API ERROR ====="
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "===== GEMINI FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo ""
          echo "===== GEMINI RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract generated Project_Diboo files
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          print("")
          print("================================")
          print("EXTRACTING PROJECT_DIBOO OUTPUT")
          print("================================")

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini response did not contain model output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          try:
              generated = json.loads(output_text)

          except json.JSONDecodeError as error:

              print("")
              print("===== INVALID GEMINI JSON =====")
              print(output_text)

              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(blender_script, str):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[len("```python"):]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = blender_script.rstrip()[:-3]

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")

          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print("blender_scene/blender_scene.py")

          print("")
          print("Script size:")
          print(
              len(blender_script),
              "characters"
          )
          PY


      # ============================================================
      # 3. VALIDATE STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "duration_target",
              "language",
              "hook",
              "narration",
              "scenes"
          ]

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          raw_duration = story["duration_target"]

          if isinstance(raw_duration, bool):
              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          if isinstance(raw_duration, int):
              duration = raw_duration

          elif isinstance(raw_duration, float):
              duration = int(raw_duration)

          elif isinstance(raw_duration, str):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:
                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(
                  match.group(0)
              )

          else:
              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          if not 40 <= duration <= 60:
              raise RuntimeError(
                  f"Invalid duration: {duration}. Must be 40-60 seconds."
              )

          scenes = story["scenes"]

          if not isinstance(scenes, list):
              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) == 0:
              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(scene, dict):
                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:
                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw_scene_duration = scene["duration"]

              if isinstance(
                  raw_scene_duration,
                  bool
              ):
                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              if isinstance(
                  raw_scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      raw_scene_duration
                  )

                  if not match:
                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(
                  raw_scene_duration,
                  (int, float)
              ):

                  scene_duration = int(
                      raw_scene_duration
                  )

              else:

                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:
                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration
              total_scene_duration += scene_duration

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("DIBOO STORY VALIDATION: PASSED")
          print("")
          print("TITLE:")
          print(story["title"])
          print("")
          print("DURATION:")
          print(duration, "seconds")
          print("")
          print("SCENES:")
          print(len(scenes))
          print("")
          print("TOTAL SCENE DURATION:")
          print(total_scene_duration, "seconds")
          PY


      # ============================================================
      # 4. VALIDATE BLENDER PYTHON SYNTAX
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCRIPT VALIDATION"
          echo "================================"

          test -s blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax: PASSED"

          echo ""
          echo "Script:"
          ls -lh blender_scene/blender_scene.py


      # ============================================================
      # 5. PREPARE BLENDER
      # ============================================================

      - name: Prepare Blender
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER PREPARATION"
          echo "================================"

          if command -v blender >/dev/null 2>&1; then

            blender --version

          else

            sudo apt-get update

            sudo apt-get install -y \
              blender \
              libtbb12 \
              libegl1 \
              libgl1 \
              libglib2.0-0

            blender --version

          fi


      # ============================================================
      # 6. GENERATE BLENDER SCENE
      # ============================================================

      - name: Generate Blender scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "================================"

          rm -f /tmp/diboo_story_scene.blend
          rm -f blender_scene/blender_scene_error.log

          MAX_REPAIRS=3
          REPAIR=0

          while true
          do

            echo ""
            echo "================================"
            echo "BLENDER GENERATION ATTEMPT"
            echo "$((REPAIR + 1))"
            echo "================================"

            rm -f /tmp/diboo_story_scene.blend

            set +e

            blender \
              -b \
              --python blender_scene/blender_scene.py \
              > blender_scene/blender_run.log 2>&1

            BLENDER_EXIT=$?

            set -e

            echo ""
            echo "BLENDER EXIT CODE:"
            echo "$BLENDER_EXIT"

            if [ "$BLENDER_EXIT" -eq 0 ] && \
               [ -f /tmp/diboo_story_scene.blend ]; then

              echo ""
              echo "================================"
              echo "DIBOO BLENDER SCENE READY"
              echo "================================"

              ls -lh \
                /tmp/diboo_story_scene.blend

              break

            fi

            echo ""
            echo "================================"
            echo "BLENDER SCENE GENERATION FAILED"
            echo "================================"

            tail -n 120 \
              blender_scene/blender_run.log \
              || true

            cp \
              blender_scene/blender_run.log \
              blender_scene/blender_scene_error.log

            if [ "$REPAIR" -ge "$MAX_REPAIRS" ]; then

              echo ""
              echo "Maximum Blender repair attempts reached."

              exit 1

            fi

            REPAIR=$((REPAIR + 1))

            echo ""
            echo "Sending Blender error to Gemini for automatic repair..."
            echo "Repair attempt: $REPAIR / $MAX_REPAIRS"

            python3 - <<'PY'
          import json

          from pathlib import Path

          script = Path(
              "blender_scene/blender_scene.py"
          ).read_text(
              encoding="utf-8"
          )

          error = Path(
              "blender_scene/blender_run.log"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          if len(error) > 16000:
              error = error[-16000:]

          prompt = f"""
          You are repairing a Blender 4.0.2 Python script for Project_Diboo.

          The previous generated script failed during Blender background execution.

          IMPORTANT:
          Return ONLY the complete corrected Python script.
          No Markdown.
          No code fences.
          No explanations.

          The corrected script MUST:
          - work in Blender 4.0.2 background mode
          - import bpy
          - use only stable bpy APIs
          - never use bpy.ops.mesh.create_plane
          - use bpy.ops.mesh.primitive_plane_add for planes
          - never access material node inputs by numeric index
          - use named node sockets only
          - color sockets must receive RGBA tuples
          - float sockets must receive floats
          - create a camera
          - set scene.camera = camera
          - create at least one light
          - use scene.render.engine = 'BLENDER_EEVEE'
          - NEVER use BLENDER_EEVEE_NEXT
          - configure 1080x1920
          - configure 24 FPS
          - preserve the existing story and animation concept
          - keep geometry and materials simple
          - avoid simulations and expensive effects
          - save to /tmp/diboo_story_scene.blend
          - verify the file exists after saving
          - print DIBOO BLENDER SCENE CREATED
          - print STORY TITLE
          - print TOTAL FRAMES
          - print FPS
          - print RESOLUTION
          - print BLENDER SCENE READY

          PREVIOUS SCRIPT:

          {script}

          BLENDER ERROR:

          {error}
          """

          request = {
              "model": "gemini-3.5-flash-lite",
              "input": prompt
          }

          Path(
              "repair_request.json"
          ).write_text(
              json.dumps(
                  request,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

            REPAIR_RESPONSE=$(curl -sS \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @repair_request.json)

            echo "$REPAIR_RESPONSE" \
              > blender_scene/repair_response.json

            python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "blender_scene/repair_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini repair response contained no script."
              )

          if output_text.startswith("```python"):
              output_text = output_text[len("```python"):]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          if not output_text:
              raise RuntimeError(
                  "Gemini returned an empty repaired script."
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              output_text,
              encoding="utf-8"
          )

          print("")
          print("===== GEMINI REPAIRED BLENDER SCRIPT RECEIVED =====")
          print(
              "Characters:",
              len(output_text)
          )
          PY

            python3 -m py_compile \
              blender_scene/blender_scene.py

            echo ""
            echo "Repaired Blender script syntax: PASSED"

          done


      # ============================================================
      # 7. CONFIGURE FAST BLENDER RENDER
      # ============================================================

      - name: Configure fast Blender render
        run: |
          set -e

          echo "================================"
          echo "DIBOO FAST BLENDER RENDER CONFIGURATION"
          echo "================================"

          python3 - <<'PY'
          import bpy

          blend_file = "/tmp/diboo_story_scene.blend"

          bpy.ops.wm.open_mainfile(
              filepath=blend_file
          )

          scene = bpy.context.scene

          scene.render.engine = 'BLENDER_EEVEE'

          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100

          scene.render.fps = 24

          scene.render.image_settings.file_format = 'PNG'

          scene.frame_start = 1
          scene.frame_end = 1200

          scene.render.filepath = "/tmp/diboo_render/frame_"

          if hasattr(scene, "eevee"):
              try:
                  scene.eevee.taa_render_samples = 8
              except Exception:
                  pass

          bpy.ops.wm.save_as_mainfile(
              filepath=blend_file
          )

          print("")
          print("Render configuration:")
          print("EEVEE samples: 8")
          print("Resolution: 1080x1920")
          print("FPS: 24")

          print("")
          print("================================")
          print("DIBOO FORCED RENDER RANGE")
          print("================================")
          print("")
          print("FRAME START:")
          print(scene.frame_start)
          print("")
          print("FRAME END:")
          print(scene.frame_end)
          print("")
          print("TOTAL EXPECTED FRAMES:")
          print(
              scene.frame_end - scene.frame_start + 1
          )
          PY


      # ============================================================
      # 8. RENDER COMPLETE ANIMATION
      # ============================================================

      - name: Render Blender story test
        run: |
          set -e

          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER"
          echo "================================"

          rm -rf /tmp/diboo_render

          mkdir -p /tmp/diboo_render

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -s 1 \
            -e 1200 \
            -a

          echo ""
          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER FINISHED"
          echo "================================"

          du -sh /tmp/diboo_render

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "TOTAL PNG FRAMES:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -ne 1200 ]; then
            echo ""
            echo "ERROR: Expected exactly 1200 PNG frames."
            exit 1
          fi

          echo ""
          echo "FIRST 3 FRAMES:"

          find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | head -n 3 || true

          echo ""
          echo "LAST 3 FRAMES:"

          find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | tail -n 3 || true

          echo ""
          echo "================================"
          echo "DIBOO RENDER OUTPUT READY"
          echo "================================"


      # ============================================================
      # 9. VERIFY COMPLETE ANIMATION RENDER
      # ============================================================

      - name: Verify complete animation render
        run: |
          set -e

          echo "================================"
          echo "DIBOO COMPLETE RENDER VERIFICATION"
          echo "================================"

          test -d /tmp/diboo_render

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "PNG FRAME COUNT:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -ne 1200 ]; then
            echo ""
            echo "ERROR: Expected exactly 1200 PNG frames."
            exit 1
          fi

          echo ""
          echo "FIRST FRAME:"

          find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | head -n 1 || true

          echo ""
          echo "LAST FRAME:"

          find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | tail -n 1 || true

          echo ""
          echo "TOTAL RENDER SIZE:"

          du -sh /tmp/diboo_render

          echo ""
          echo "================================"
          echo "DIBOO COMPLETE ANIMATION RENDER: PASSED"
          echo "================================"


      # ============================================================
      # 10. PREPARE FFMPEG
      # ============================================================

      - name: Prepare FFmpeg
        run: |
          set -e

          echo "================================"
          echo "DIBOO FFMPEG PREPARATION"
          echo "================================"

          if command -v ffmpeg >/dev/null 2>&1; then

            echo ""
            echo "FFmpeg already available:"
            ffmpeg -version | head -n 1

          else

            echo ""
            echo "FFmpeg not found."
            echo "Installing FFmpeg..."

            sudo apt-get update

            sudo apt-get install -y ffmpeg

            echo ""
            echo "FFmpeg installation completed."

            ffmpeg -version | head -n 1

          fi


      # ============================================================
      # 11. ENCODE FINAL MP4
      # ============================================================

      - name: Encode final MP4 with FFmpeg
        run: |
          set -e

          echo "================================"
          echo "DIBOO FINAL MP4 ENCODING"
          echo "================================"

          ffmpeg \
            -y \
            -framerate 24 \
            -start_number 1 \

name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI 3.5 FLASH-LITE GENERATOR"
          echo "================================"

          mkdir -p blender_scene

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the story and Blender procedural generation engine for Project_Diboo. Generate BOTH a structured story and a complete Blender Python script in ONE response. The story is for an original 3D cartoon YouTube Short. It must be highly visual and understandable without audio. Use simple objects, animals, vehicles, machines, or simple characters. Do not copy copyrighted characters, franchises, companies, or protected visual styles. Target approximately 50 seconds and remain between 40 and 60 seconds. Narration language must be English. Story structure: HOOK 0-5 seconds, SITUATION 5-12 seconds, PROBLEM 12-25 seconds, ACTION 25-40 seconds, RESOLUTION 40-50 seconds, PAYOFF 50-55 seconds. Create strong visual storytelling, clear cause and effect, dynamic camera movements, and SFX suggestions. Return ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly: title, duration_target, language, hook, narration, scenes. duration_target MUST be a plain integer. language MUST be en. Every scene MUST contain: duration, description, camera, action, sfx. Scene duration MUST be a plain integer. The blender_script field MUST contain a complete standalone Python script for Blender 4.0.2. The Blender script must use bpy and generate the scene procedurally. It must create the environment, ground, story objects, simple characters when needed, materials, camera, lighting, and animation. Do not require external assets, addons, downloads, or external files. Use only valid Blender 4.0.2 bpy operators and APIs. Use simple primitives such as cubes, spheres, cylinders, cones and planes. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. NEVER access Blender material node inputs by numeric socket indexes such as inputs[21], inputs[20], inputs[0], etc. When using Principled BSDF materials, access sockets by NAME using node.inputs.get('Base Color'), node.inputs.get('Roughness'), node.inputs.get('Metallic'), node.inputs.get('Specular IOR Level'), node.inputs.get('Alpha'), or similar named sockets, and only assign a value when the socket exists. Color sockets require a 4-value RGBA tuple. Float sockets require a single float. Do not assign a float to a color socket and do not assign a tuple to a float socket. Prefer simple material creation with diffuse_color when possible to reduce compatibility problems. The script MUST create the camera before animation and set scene.camera = camera. Before saving, verify scene.camera is not None and raise an error if it is missing. Create at least one light. Use exactly scene.render.engine = 'BLENDER_EEVEE'. Do NOT use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100, and 24 FPS. Convert the story duration to frames and set scene.frame_start = 1 and scene.frame_end accordingly. Prefer reliability and fast rendering over visual complexity. Avoid unsupported Blender APIs and experimental features. The script must save the Blender file to /tmp/diboo_story_scene.blend. At the end print DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION and BLENDER SCENE READY. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI 3.5 FLASH-LITE ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -s \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo ""
                echo "Gemini 3.5 Flash-Lite temporarily unavailable."
                echo "Waiting 20 seconds before retry..."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE '"code": ?429|too_many_requests|Rate limit exceeded'; then
                echo ""
                echo "Gemini 3.5 Flash-Lite rate limit reached."
                echo "Waiting 60 seconds before retry..."
                sleep 60
                continue
              fi

              echo ""
              echo "===== GEMINI API ERROR ====="
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "===== GEMINI 3.5 FLASH-LITE FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo ""
          echo "===== GEMINI 3.5 FLASH-LITE RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract generated Project_Diboo files
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          print("")
          print("================================")
          print("EXTRACTING PROJECT_DIBOO OUTPUT")
          print("================================")

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:

              print("")
              print("===== GEMINI RESPONSE STRUCTURE =====")

              print(
                  json.dumps(
                      response,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise RuntimeError(
                  "Gemini response did not contain output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          try:
              generated = json.loads(output_text)

          except json.JSONDecodeError as error:

              print("")
              print("===== INVALID GEMINI JSON =====")
              print(output_text)

              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(
              blender_script,
              str
          ):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[
                  len("```python"):
              ]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = (
                  blender_script.rstrip()[:-3]
              )

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")

          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print(
              "blender_scene/blender_scene.py"
          )

          print("")
          print("Script size:")
          print(
              len(blender_script),
              "characters"
          )
          PY


      # ============================================================
      # 3. VALIDATE PROJECT_DIBOO STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "duration_target",
              "language",
              "hook",
              "narration",
              "scenes"
          ]

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          raw_duration = story["duration_target"]

          if isinstance(raw_duration, bool):
              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          elif isinstance(raw_duration, int):
              duration = raw_duration

          elif isinstance(raw_duration, float):
              duration = int(raw_duration)

          elif isinstance(raw_duration, str):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:
                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(
                  match.group(0)
              )

          else:
              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          print("")
          print("Normalized duration:")
          print(
              duration,
              "seconds"
          )

          if not 40 <= duration <= 60:
              raise RuntimeError(
                  f"Invalid duration: {duration}. "
                  "Must be between 40 and 60 seconds."
              )

          scenes = story["scenes"]

          if not isinstance(
              scenes,
              list
          ):
              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) == 0:
              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(
                  scene,
                  dict
              ):
                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:
                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw_scene_duration = scene["duration"]

              if isinstance(
                  raw_scene_duration,
                  bool
              ):
                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              elif isinstance(
                  raw_scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      raw_scene_duration
                  )

                  if not match:
                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(
                  raw_scene_duration,
                  (int, float)
              ):
                  scene_duration = int(
                      raw_scene_duration
                  )

              else:
                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:
                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration

              total_scene_duration += scene_duration

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("================================")
          print("DIBOO STORY VALIDATION: PASSED")
          print("================================")

          print("")
          print("TITLE:")
          print(story["title"])

          print("")
          print("DURATION:")
          print(
              story["duration_target"],
              "seconds"
          )

          print("")
          print("LANGUAGE:")
          print(story["language"])

          print("")
          print("SCENES:")
          print(len(scenes))

          print("")
          print("TOTAL SCENE DURATION:")
          print(
              total_scene_duration,
              "seconds"
          )

          print("")
          print("story.json is valid.")
          PY


      # ============================================================
      # 4. VALIDATE BLENDER PYTHON SCRIPT
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCRIPT VALIDATION"
          echo "================================"

          test -s \
            blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax:"
          echo "PASSED"

          echo ""
          echo "Script:"
          ls -lh \
            blender_scene/blender_scene.py

          echo ""
          echo "================================"
          echo "DIBOO BLENDER SCRIPT: PASSED"
          echo "================================"


      # ============================================================
      # 5. INSTALL / DETECT BLENDER
      # ============================================================

      - name: Prepare Blender
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER PREPARATION"
          echo "================================"

          if command -v blender >/dev/null 2>&1; then

            echo ""
            echo "Blender already available:"
            blender --version

          else

            echo ""
            echo "Blender not found."
            echo "Installing Blender..."

            sudo apt-get update

            sudo apt-get install -y \
              blender \
              libtbb12 \
              libegl1 \
              libgl1 \
              libglib2.0-0

            echo ""
            echo "Blender installation completed."

            blender --version

          fi


      # ============================================================
      # 6. GENERATE BLENDER SCENE
      # ============================================================

      - name: Generate Blender scene
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "================================"

          echo ""
          echo "Running Blender scene generator..."

          blender \
            -b \
            --python blender_scene/blender_scene.py

          echo ""
          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATION FINISHED"
          echo "================================"

          if [ ! -f /tmp/diboo_story_scene.blend ]; then

            echo ""
            echo "ERROR:"
            echo "/tmp/diboo_story_scene.blend was not created."

            exit 1

          fi

          echo ""
          echo "Blender file created successfully:"

          ls -lh \
            /tmp/diboo_story_scene.blend


      # ============================================================
      # 7. RENDER COMPLETE ANIMATION
      # ============================================================

      - name: Render Blender story test
        run: |
          set -e

          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER"
          echo "================================"

          rm -rf /tmp/diboo_render

          mkdir -p \
            /tmp/diboo_render

          echo ""
          echo "Starting complete Blender animation render..."

          echo ""
          echo "IMPORTANT:"
          echo "Blender will use the frame_start and frame_end"
          echo "stored inside /tmp/diboo_story_scene.blend."
          echo "No artificial frame limit is being applied."

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -a

          echo ""
          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER FINISHED"
          echo "================================"

          echo ""
          echo "TOTAL RENDER SIZE:"

          du -sh \
            /tmp/diboo_render

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "TOTAL PNG FRAMES:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -lt 1 ]; then

            echo ""
            echo "ERROR: No PNG frames were generated."

            exit 1

          fi

          echo ""
          echo "Render produced PNG frames successfully."

          echo ""
          echo "================================"
          echo "DIBOO RENDER OUTPUT READY"
          echo "================================"


      # ============================================================
      # 8. VERIFY COMPLETE ANIMATION
      # ============================================================

      - name: Verify complete animation render
        run: |
          set -e

          echo "================================"
          echo "DIBOO COMPLETE RENDER VERIFICATION"
          echo "================================"

          if [ ! -d /tmp/diboo_render ]; then

            echo ""
            echo "ERROR: Render directory does not exist."

            exit 1

          fi

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "PNG FRAME COUNT:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -lt 1 ]; then

            echo ""
            echo "ERROR: No PNG frames found."

            exit 1

          fi

          FIRST_FRAME=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | sed -n '1p')

          LAST_FRAME=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | sort \
            | tail -n 1)

          echo ""
          echo "FIRST FRAME:"
          echo "$FIRST_FRAME"

          echo ""
          echo "LAST FRAME:"
          echo "$LAST_FRAME"

          echo ""
          echo "TOTAL RENDER SIZE:"

          du -sh \
            /tmp/diboo_render

          echo ""
          echo "================================"
          echo "DIBOO COMPLETE ANIMATION RENDER: PASSED"
          echo "================================"


      # ============================================================
      # 9. COMPLETE TEST
      # ============================================================

      - name: Complete Project_Diboo test
        run: |
          set -e

          echo ""
          echo "================================"
          echo "PROJECT_DIBOO"
          echo "COMPLETE TEST"
          echo "================================"

          echo ""
          echo "Story generation: PASSED"
          echo "Story validation: PASSED"
          echo "Blender script validation: PASSED"
          echo "Blender preparation: PASSED"
          echo "Blender scene generation: PASSED"
          echo "Full animation render: PASSED"
          echo "Render verification: PASSED"

          echo ""
          echo "PROJECT_DIBOO TEST PIPELINE: PASSED"

          echo "================================"

name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE STORY + BLENDER SCRIPT
      # ============================================================

      - name: Generate story and Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI STORY + BLENDER GENERATOR"
          echo "================================"

          mkdir -p blender_scene
          mkdir -p logs

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the story, editing-plan and Blender procedural generation engine for Project_Diboo. Generate BOTH a complete structured production package and a complete Blender Python script in ONE response. The result is an original 3D cartoon YouTube Short / TikTok Short. It must be highly visual, understandable without audio, fast-paced and suitable for vertical short-form video. Use simple original objects, animals, vehicles, machines or simple characters. Do not copy copyrighted characters, franchises, companies or protected visual styles. Target approximately 50 seconds and remain between 40 and 60 seconds. Narration language must be English. Use 24 FPS and vertical 1080x1920 composition. The final production package must include narration, sound effects, background music direction, subtitles and social-media metadata. IMPORTANT: RETURN ALL REQUIRED FIELDS. NEVER OMIT hook, narration, music, subtitles, description or hashtags. Return ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly these fields: title, description, hashtags, duration_target, language, hook, narration, music, subtitles, scenes. duration_target MUST be a plain integer between 40 and 60. language MUST be en. hook MUST be a non-empty string. narration MUST be a non-empty list of narration segments. music MUST be a non-empty object containing style, mood and timing. subtitles MUST be a non-empty list. scenes MUST be a non-empty list. Every scene MUST contain: duration, description, camera, action, sfx, narration, music, subtitle. Scene duration MUST be a plain positive integer. The total scene duration should approximately equal duration_target. Narration should cover the story naturally across the scenes. SFX should describe useful sound effects that can be generated procedurally or with simple audio synthesis. Music should describe a simple royalty-free/original background music concept. Subtitles must be concise, readable and synchronized conceptually with the narration. The description must be suitable for the YouTube/TikTok post. Hashtags must be a list of relevant hashtags. The Blender script MUST be a complete standalone Python script for Blender 4.0.2. The script MUST be conservative, deterministic and reliable. It MUST NOT depend on external files, addons, downloads, textures, fonts, images, sounds or network access. It MUST run correctly in Blender 4.0.2 background mode using: blender -b --python blender_scene.py. The script MUST import bpy and math only unless another Python standard-library module is absolutely necessary. It MUST first clear the default scene using bpy.ops.object.select_all(action='SELECT') and bpy.ops.object.delete(use_global=False). Use only stable Blender 4.0.2 operators. For planes ALWAYS use bpy.ops.mesh.primitive_plane_add. NEVER use bpy.ops.mesh.create_plane. Use cubes, spheres, cylinders, cones and planes only. Create materials using bpy.data.materials.new and diffuse_color whenever possible. If using nodes, NEVER access Principled BSDF inputs by numeric indexes. NEVER use inputs[21], inputs[20], inputs[0] or any numeric socket index. Access sockets only by name using node.inputs.get('Base Color'), node.inputs.get('Roughness'), node.inputs.get('Metallic'), node.inputs.get('Specular IOR Level'), node.inputs.get('Alpha'), etc. Color values MUST be 4-value RGBA tuples. Float values MUST be single floats. Create the camera BEFORE creating animation. Set scene.camera = camera. Create at least one light. Use scene.render.engine = 'BLENDER_EEVEE' exactly. NEVER use BLENDER_EEVEE_NEXT. Configure vertical video at 1080x1920, resolution percentage 100 and 24 FPS. Convert duration_target to frames. Set scene.frame_start = 1 and scene.frame_end = duration_target * scene.render.fps. Keep geometry and lighting simple for fast EEVEE rendering. Avoid simulations, particle systems, geometry nodes, compositing, volumetrics, cloth, smoke, fire, rigid body simulations and expensive modifiers. Prefer simple keyframe animation. Every animated object must already exist before keyframes are inserted. Use strong camera framing for vertical video. Keep the visual action readable at 1080x1920. Do NOT generate audio inside Blender. Do NOT depend on external audio files. Audio will be generated later in the pipeline. Before saving, verify that scene.camera is not None. The script MUST save the Blender scene using bpy.ops.wm.save_as_mainfile(filepath='/tmp/diboo_story_scene.blend'). After saving, verify that the file exists using Python standard library os.path.exists. At the end print exactly these diagnostic messages: DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION, BLENDER SCENE READY. The script must not render anything itself. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo "Gemini temporarily unavailable."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE '"code": ?429|too_many_requests|Rate limit exceeded'; then
                echo "Gemini rate limit reached."
                sleep 60
                continue
              fi

              echo "===== GEMINI API ERROR ====="
              cat gemini_response.json
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "===== GEMINI FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo "===== GEMINI RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract generated Project_Diboo files
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open("gemini_response.json", "r", encoding="utf-8") as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):
              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):
                  if content.get("type") == "text":
                      text = content.get("text", "").strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini response did not contain model output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          try:
              generated = json.loads(output_text)

          except json.JSONDecodeError as error:
              print("===== INVALID GEMINI JSON =====")
              print(output_text)
              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(story, dict):
              raise RuntimeError(
                  "story must be an object."
              )

          if not isinstance(blender_script, str):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[len("```python"):]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = blender_script.rstrip()[:-3]

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")
          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print("blender_scene/blender_scene.py")

          print("")
          print("Script size:")
          print(len(blender_script), "characters")
          PY


      # ============================================================
      # 3. VALIDATE COMPLETE PROJECT_DIBOO STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "description",
              "hashtags",
              "duration_target",
              "language",
              "hook",
              "narration",
              "music",
              "subtitles",
              "scenes"
          ]

          print("")
          print("Checking required story fields...")

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

              if story[field] is None:
                  raise RuntimeError(
                      f"Required field is null: {field}"
                  )

          if not isinstance(story["title"], str) or not story["title"].strip():
              raise RuntimeError("title must be a non-empty string.")

          if not isinstance(story["description"], str) or not story["description"].strip():
              raise RuntimeError("description must be a non-empty string.")

          if not isinstance(story["hook"], str) or not story["hook"].strip():
              raise RuntimeError("hook must be a non-empty string.")

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          raw_duration = story["duration_target"]

          if isinstance(raw_duration, bool):
              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          if isinstance(raw_duration, int):
              duration = raw_duration

          elif isinstance(raw_duration, float):
              duration = int(raw_duration)

          elif isinstance(raw_duration, str):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:
                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(match.group(0))

          else:
              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          if not 40 <= duration <= 60:
              raise RuntimeError(
                  f"Invalid duration: {duration}. Must be 40-60 seconds."
              )

          hashtags = story["hashtags"]

          if not isinstance(hashtags, list):
              raise RuntimeError(
                  "hashtags must be a list."
              )

          if len(hashtags) == 0:
              raise RuntimeError(
                  "hashtags cannot be empty."
              )

          narration = story["narration"]

          if not isinstance(narration, list):
              raise RuntimeError(
                  "narration must be a list."
              )

          if len(narration) == 0:
              raise RuntimeError(
                  "narration cannot be empty."
              )

          music = story["music"]

          if not isinstance(music, dict):
              raise RuntimeError(
                  "music must be an object."
              )

          for field in ["style", "mood", "timing"]:
              if field not in music:
                  raise RuntimeError(
                      f"music missing required field: {field}"
                  )

          subtitles = story["subtitles"]

          if not isinstance(subtitles, list):
              raise RuntimeError(
                  "subtitles must be a list."
              )

          if len(subtitles) == 0:
              raise RuntimeError(
                  "subtitles cannot be empty."
              )

          scenes = story["scenes"]

          if not isinstance(scenes, list):
              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) == 0:
              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx",
              "narration",
              "music",
              "subtitle"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(scene, dict):
                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:
                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw_scene_duration = scene["duration"]

              if isinstance(
                  raw_scene_duration,
                  bool
              ):
                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              if isinstance(
                  raw_scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      raw_scene_duration
                  )

                  if not match:
                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(
                  raw_scene_duration,
                  (int, float)
              ):

                  scene_duration = int(
                      raw_scene_duration
                  )

              else:

                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:
                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration
              total_scene_duration += scene_duration

          if abs(total_scene_duration - duration) > 5:
              raise RuntimeError(
                  f"Total scene duration ({total_scene_duration}s) "
                  f"differs too much from target duration ({duration}s)."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("DIBOO STORY VALIDATION: PASSED")
          print("")
          print("TITLE:")
          print(story["title"])
          print("")
          print("DESCRIPTION:")
          print(story["description"])
          print("")
          print("DURATION:")
          print(duration, "seconds")
          print("")
          print("SCENES:")
          print(len(scenes))
          print("")
          print("TOTAL SCENE DURATION:")
          print(total_scene_duration, "seconds")
          print("")
          print("NARRATION SEGMENTS:")
          print(len(narration))
          print("")
          print("SUBTITLES:")
          print(len(subtitles))
          print("")
          print("HASHTAGS:")
          print(" ".join(str(x) for x in hashtags))
          print("")
          print("================================")
          print("PROJECT_DIBOO STORY: PASSED")
          print("================================")
          PY


      # ============================================================
      # 4. VALIDATE BLENDER PYTHON SYNTAX
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCRIPT VALIDATION"
          echo "================================"

          test -s blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax: PASSED"

          ls -lh \
            blender_scene/blender_scene.py


      # ============================================================
      # 5. PREPARE BLENDER
      # ============================================================

      - name: Prepare Blender
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER PREPARATION"
          echo "================================"

          if command -v blender >/dev/null 2>&1; then

            blender --version

          else

            sudo apt-get update

            sudo apt-get install -y \
              blender \
              libtbb12 \
              libegl1 \
              libgl1 \
              libglib2.0-0

            blender --version

          fi


      # ============================================================
      # 6. BLENDER SCENE GENERATION WITH AUTO-RECOVERY
      # ============================================================

      - name: Generate Blender scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "================================"

          rm -f /tmp/diboo_story_scene.blend
          rm -f blender_scene/blender_scene_error.log

          MAX_REPAIRS=3
          REPAIR=0

          while true
          do

            echo ""
            echo "================================"
            echo "BLENDER GENERATION ATTEMPT"
            echo "$((REPAIR + 1))"
            echo "================================"

            rm -f /tmp/diboo_story_scene.blend

            set +e

            blender \
              -b \
              --python blender_scene/blender_scene.py \
              > blender_scene/blender_run.log 2>&1

            BLENDER_EXIT=$?

            set -e

            echo ""
            echo "BLENDER EXIT CODE:"
            echo "$BLENDER_EXIT"

            if [ "$BLENDER_EXIT" -eq 0 ] && \
               [ -f /tmp/diboo_story_scene.blend ]; then

              echo ""
              echo "================================"
              echo "DIBOO BLENDER SCENE READY"
              echo "================================"

              ls -lh \
                /tmp/diboo_story_scene.blend

              break

            fi

            echo ""
            echo "================================"
            echo "BLENDER SCENE GENERATION FAILED"
            echo "================================"

            tail -n 120 \
              blender_scene/blender_run.log \
              || true

            cp \
              blender_scene/blender_run.log \
              blender_scene/blender_scene_error.log

            if [ "$REPAIR" -ge "$MAX_REPAIRS" ]; then

              echo ""
              echo "Maximum Blender repair attempts reached."

              exit 1

            fi

            REPAIR=$((REPAIR + 1))

            echo ""
            echo "Sending Blender error to Gemini..."
            echo "Repair attempt: $REPAIR / $MAX_REPAIRS"

            python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path(
              "blender_scene/blender_scene.py"
          ).read_text(
              encoding="utf-8"
          )

          error = Path(
              "blender_scene/blender_run.log"
          ).read_text(
              encoding="utf-8",
              errors="replace"
          )

          if len(error) > 16000:
              error = error[-16000:]

          prompt = f"""
          You are repairing a Blender 4.0.2 Python script for Project_Diboo.

          The previous generated script failed during Blender background execution.

          Return ONLY the complete corrected Python script.
          No Markdown.
          No code fences.
          No explanations.

          The corrected script MUST:

          - work in Blender 4.0.2 background mode
          - import bpy
          - use only stable bpy APIs
          - never use bpy.ops.mesh.create_plane
          - use bpy.ops.mesh.primitive_plane_add for planes
          - never access material node inputs by numeric index
          - use named node sockets only
          - color sockets must receive RGBA tuples
          - float sockets must be floats
          - create a camera
          - set scene.camera = camera
          - create at least one light
          - use scene.render.engine = 'BLENDER_EEVEE'
          - NEVER use BLENDER_EEVEE_NEXT
          - configure 1080x1920
          - configure 24 FPS
          - preserve the existing story and animation concept
          - keep geometry and materials simple
          - avoid simulations and expensive effects
          - save to /tmp/diboo_story_scene.blend
          - verify the file exists after saving
          - print DIBOO BLENDER SCENE CREATED
          - print STORY TITLE
          - print TOTAL FRAMES
          - print FPS
          - print RESOLUTION
          - print BLENDER SCENE READY

          IMPORTANT:
          Do not create audio.
          Do not require external assets.
          Do not download anything.

          PREVIOUS SCRIPT:

          {script}

          BLENDER ERROR:

          {error}
          """

          request = {
              "model": "gemini-3.5-flash-lite",
              "input": prompt
          }

          Path(
              "repair_request.json"
          ).write_text(
              json.dumps(
                  request,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )
          PY

            REPAIR_RESPONSE=$(curl -sS \
              --fail-with-body \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @repair_request.json)

            echo "$REPAIR_RESPONSE" \
              > blender_scene/repair_response.json

            python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "blender_scene/repair_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:
              raise RuntimeError(
                  "Gemini repair response contained no script."
              )

          if output_text.startswith("```python"):
              output_text = output_text[len("```python"):]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          if not output_text:
              raise RuntimeError(
                  "Gemini returned an empty repaired script."
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              output_text,
              encoding="utf-8"
          )

          print("")
          print("===== GEMINI REPAIRED BLENDER SCRIPT RECEIVED =====")
          print("Characters:", len(output_text))
          PY

            python3 -m py_compile \
              blender_scene/blender_scene.py

            echo ""
            echo "Repaired Blender script syntax: PASSED"

          done


      # ============================================================
      # 7. CONFIGURE FAST BLENDER RENDER
      # ============================================================

      - name: Configure fast Blender render
        run: |
          set -e

          echo "================================"
          echo "DIBOO FAST BLENDER RENDER CONFIGURATION"
          echo "================================"

          cat > blender_scene/configure_render.py <<'PY'
          import bpy
          import os

          scene = bpy.context.scene

          scene.render.engine = 'BLENDER_EEVEE'

          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100

          scene.render.fps = 24

          scene.frame_start = 1
          scene.frame_end = 1200

          scene.render.image_settings.file_format = 'PNG'

          if hasattr(scene, 'eevee'):
              try:
                  scene.eevee.taa_render_samples = 8
              except Exception:
                  pass

          output_path = '/tmp/diboo_story_scene.blend'

          bpy.ops.wm.save_as_mainfile(
              filepath=output_path
          )

          if not os.path.exists(output_path):
              raise RuntimeError(
                  'ERROR: Blender scene was not saved.'
              )

          print('================================')
          print('DIBOO FAST RENDER CONFIGURATION READY')
          print('================================')
          print('Render engine:')
          print(scene.render.engine)
          print('EEVEE samples:')
          print(8)
          print('Resolution:')
          print('1080x1920')
          print('FPS:')
          print(scene.render.fps)
          print('================================')
          print('DIBOO FORCED RENDER RANGE')
          print('================================')
          print('FRAME START:')
          print(scene.frame_start)
          print('FRAME END:')
          print(scene.frame_end)
          print('TOTAL EXPECTED FRAMES:')
          print(scene.frame_end - scene.frame_start + 1)
          print('================================')
          print('DIBOO BLENDER SCENE SAVED')
          print('================================')
          print(output_path)
          PY

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            --python blender_scene/configure_render.py

          test -s /tmp/diboo_story_scene.blend

          ls -lh /tmp/diboo_story_scene.blend


      # ============================================================
      # 8. RENDER COMPLETE ANIMATION
      # ============================================================

      - name: Render Blender story test
        run: |
          set -e

          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER"
          echo "================================"

          rm -rf /tmp/diboo_render

          mkdir -p /tmp/diboo_render

          echo "FRAME START: 1"
          echo "FRAME END: 1200"
          echo "TOTAL EXPECTED FRAMES: 1200"

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -s 1 \
            -e 1200 \
            -a

          echo ""
          echo "DIBOO FULL ANIMATION RENDER FINISHED"

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "TOTAL PNG FRAMES:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -ne 1200 ]; then
            echo "ERROR: Expected exactly 1200 PNG frames."
            exit 1
          fi

          echo ""
          echo "DIBOO RENDER OUTPUT READY"


      # ============================================================
      # 9. VERIFY COMPLETE ANIMATION RENDER
      # ============================================================

      - name: Verify complete animation render
        run: |
          set -e

          echo "================================"
          echo "DIBOO COMPLETE RENDER VERIFICATION"
          echo "================================"

          test -d /tmp/diboo_render

          FRAME_COUNT=$(find \
            /tmp/diboo_render \
            -maxdepth 1 \
            -type f \
            -name "*.png" \
            | wc -l)

          echo "PNG FRAME COUNT:"
          echo "$FRAME_COUNT"

          if [ "$FRAME_COUNT" -ne 1200 ]; then
            echo "ERROR: Expected 1200 frames."
            exit 1
          fi

          echo ""
          echo "TOTAL RENDER SIZE:"
          du -sh /tmp/diboo_render

          echo ""
          echo "DIBOO COMPLETE ANIMATION RENDER: PASSED"


      # ============================================================
      # 10. PREPARE FFMPEG
      # ============================================================

      - name: Prepare FFmpeg
        run: |
          set -e

          echo "================================"
          echo "DIBOO FFMPEG PREPARATION"
          echo "================================"

          if command -v ffmpeg >/dev/null 2>&1; then

            ffmpeg -version | head -n 1

          else

            sudo apt-get update

            sudo apt-get install -y ffmpeg

            ffmpeg -version | head -n 1

          fi

          echo ""
          echo "DIBOO FFMPEG READY"


      # ============================================================
      # 11. CREATE AUDIO TRACK
      # ============================================================

      - name: Create Project_Diboo audio track
        run: |
          set -e

          echo "================================"
          echo "DIBOO AUDIO PREPARATION"
          echo "================================"

          python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("Narration segments:")
          print(len(story["narration"]))

          print("")
          print("Music:")
          print(story["music"])

          print("")
          print("SFX are defined per scene.")

          print("")
          print("NOTE:")
          print(
              "This test keeps the audio architecture ready while "
              "the Blender render remains deterministic and asset-free."
          )
          PY

          # Create a silent audio bed with the exact final duration.
          # This guarantees the MP4 has an audio stream even when
          # external voice/music assets are not yet being downloaded.
          DURATION=$(python3 - <<'PY'
          import json
          with open("story.json", "r", encoding="utf-8") as f:
              print(int(json.load(f)["duration_target"]))
          PY
          )

          ffmpeg \
            -y \
            -f lavfi \
            -i "anullsrc=r=48000:cl=stereo" \
            -t "$DURATION" \
            -c:a aac \
            -b:a 128k \
            /tmp/diboo_audio_track.m4a

          test -s /tmp/diboo_audio_track.m4a

          echo ""
          echo "DIBOO AUDIO TRACK READY"


      # ============================================================
      # 12. CREATE SUBTITLE FILE
      # ============================================================

      - name: Create Project_Diboo subtitles
        run: |
          set -e

          python3 - <<'PY'
          import json

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          subtitles = story["subtitles"]

          def timestamp(seconds):
              seconds = max(0, float(seconds))

              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              millis = int(round((seconds - int(seconds)) * 1000))

              if millis >= 1000:
                  secs += 1
                  millis -= 1000

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{millis:03d}"
              )

          lines = []
          current = 0.0

          for index, item in enumerate(subtitles, start=1):

              if isinstance(item, dict):

                  text = str(
                      item.get(
                          "text",
                          item.get(
                              "subtitle",
                              ""
                          )
                      )
                  ).strip()

                  start = item.get(
                      "start",
                      current
                  )

                  end = item.get(
                      "end",
                      start + 2.0
                  )

                  try:
                      start = float(start)
                      end = float(end)
                  except Exception:
                      start = current
                      end = current + 2.0

              else:

                  text = str(item).strip()
                  start = current
                  end = current + 2.0

              if not text:
                  continue

              lines.append(
                  str(index)
              )

              lines.append(
                  f"{timestamp(start)} --> {timestamp(end)}"
              )

              lines.append(text)
              lines.append("")

              current = end

          with open(
              "/tmp/diboo_subtitles.srt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(lines)
              )

          print("")
          print("DIBOO SUBTITLE FILE CREATED")
          print("/tmp/diboo_subtitles.srt")
          PY

          test -s /tmp/diboo_subtitles.srt


      # ============================================================
      # 13. ENCODE FINAL MP4 WITH AUDIO + SUBTITLES
      # ============================================================

      - name: Encode final Project_Diboo MP4
        run: |
          set -e

          echo "================================"
          echo "DIBOO FINAL MP4 ENCODING"
          echo "================================"

          rm -f /tmp/Project_Diboo_Final.mp4

          ffmpeg \
            -y \
            -framerate 24 \
            -start_number 1 \
            -i /tmp/diboo_render/frame_%04d.png \
            -i /tmp/diboo_audio_track.m4a \
            -vf "subtitles=/tmp/diboo_subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF&,OutlineColour=&H00000000&,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=110'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            /tmp/Project_Diboo_Final.mp4

          test -s /tmp/Project_Diboo_Final.mp4

          echo ""
          echo "================================"
          echo "DIBOO FINAL MP4 CREATED"
          echo "================================"

          ls -lh /tmp/Project_Diboo_Final.mp4


      # ============================================================
      # 14. VERIFY FINAL MP4
      # ============================================================

      - name: Verify final MP4
        run: |
          set -e

          echo "================================"
          echo "DIBOO FINAL MP4 VERIFICATION"
          echo "================================"

          test -s /tmp/Project_Diboo_Final.mp4

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate,codec_type \
            -of default=noprint_wrappers=1 \
            /tmp/Project_Diboo_Final.mp4

          echo ""
          echo "================================"
          echo "DIBOO FINAL MP4: PASSED"
          echo "================================"


      # ============================================================
      # 15. SEND FINAL VIDEO TO TELEGRAM
      # ============================================================

      - name: Send final Project_Diboo MP4 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          echo "================================"
          echo "DIBOO TELEGRAM DELIVERY"
          echo "================================"

          MP4="/tmp/Project_Diboo_Final.mp4"

          test -s "$MP4"

          FILE_SIZE=$(stat -c%s "$MP4")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))

          TITLE=$(python3 - <<'PY'
          import json
          with open("story.json", "r", encoding="utf-8") as f:
              print(json.load(f)["title"])
          PY
          )

          DESCRIPTION=$(python3 - <<'PY'
          import json
          with open("story.json", "r", encoding="utf-8") as f:
              print(json.load(f)["description"])
          PY
          )

          HASHTAGS=$(python3 - <<'PY'
          import json
          with open("story.json", "r", encoding="utf-8") as f:
              story = json.load(f)

          print(
              " ".join(
                  str(x)
                  for x in story["hashtags"]
              )
          )
          PY
          )

          CAPTION="🎬 ${TITLE}

          ${DESCRIPTION}

          ${HASHTAGS}"

          echo ""
          echo "TITLE:"
          echo "$TITLE"

          echo ""
          echo "DESCRIPTION:"
          echo "$DESCRIPTION"

          echo ""
          echo "HASHTAGS:"
          echo "$HASHTAGS"

          echo ""
          echo "FINAL MP4 SIZE:"
          echo "${FILE_SIZE_MB} MB"

          if [ "$FILE_SIZE" -le 52428800 ]; then

            echo ""
            echo "Sending complete video to Telegram..."

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "video=@${MP4}" \
              --form-string "caption=${CAPTION}" \
              -F "supports_streaming=true")

            echo ""
            echo "Telegram response:"
            echo "$RESPONSE"

            echo "$RESPONSE" | grep -q '"ok":true'

            echo ""
            echo "================================"
            echo "DIBOO TELEGRAM VIDEO: PASSED"
            echo "================================"

          else

            echo ""
            echo "MP4 exceeds Telegram Bot API upload limit."
            echo "Sending notification instead..."

            RESPONSE=$(curl -sS \
              --fail-with-body \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=PROJECT_DIBOO — RENDER COMPLETE. Title: ${TITLE}. Final MP4: ${FILE_SIZE_MB} MB. The MP4 remains available in the GitHub Actions artifact: Project_Diboo_Final_MP4.")

            echo "$RESPONSE"

            echo "$RESPONSE" | grep -q '"ok":true'

          fi


      # ============================================================
      # 16. UPLOAD FINAL MP4
      # ============================================================

      - name: Upload final Project_Diboo MP4
        uses: actions/upload-artifact@v4
        with:
          name: Project_Diboo_Final_MP4
          path: /tmp/Project_Diboo_Final.mp4
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 17. UPLOAD STORY METADATA
      # ============================================================

      - name: Upload Project_Diboo metadata
        uses: actions/upload-artifact@v4
        with:
          name: Project_Diboo_Metadata
          path: |
            story.json
            /tmp/diboo_subtitles.srt
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 18. COMPLETE PROJECT_DIBOO TEST
      # ============================================================

      - name: Complete Project_Diboo test
        run: |
          set -e

          echo ""
          echo "================================"
          echo "PROJECT_DIBOO"
          echo "COMPLETE TEST"
          echo "================================"

          echo ""
          echo "Story generation: PASSED"
          echo "Story validation: PASSED"
          echo "Blender script validation: PASSED"
          echo "Blender preparation: PASSED"
          echo "Blender scene generation: PASSED"
          echo "Fast render configuration: PASSED"
          echo "Full animation render: PASSED"
          echo "Render verification: PASSED"
          echo "FFmpeg preparation: PASSED"
          echo "Audio track: PASSED"
          echo "Subtitles: PASSED"
          echo "Final MP4 encoding: PASSED"
          echo "Final MP4 verification: PASSED"
          echo "Telegram delivery: PASSED"
          echo "Final MP4 upload: PASSED"
          echo "Metadata upload: PASSED"

          echo ""
          echo "PROJECT_DIBOO TEST PIPELINE: PASSED"

          echo "================================"


      # ============================================================
      # 19. COMPLETE JOB
      # ============================================================

      - name: Complete job
        run: |
          set -e

          echo ""
          echo "================================"
          echo "PROJECT_DIBOO"
          echo "JOB COMPLETE"
          echo "================================"

          echo ""
          echo "FINAL MP4:"
          echo "Project_Diboo_Final_MP4"

          echo ""
          echo "1200 FRAMES"
          echo "24 FPS"
          echo "1080x1920"
          echo "EEVEE"
          echo "FFmpeg MP4"
          echo "AUDIO TRACK"
          echo "SUBTITLES"
          echo "TELEGRAM DELIVERY"
          echo "UPLOAD COMPLETE"

          echo ""
          echo "PROJECT_DIBOO: COMPLETE"

          echo "================================"

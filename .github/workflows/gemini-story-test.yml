name: Gemini Story Test

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GENERATE STORY + OPTIMIZED BLENDER SCRIPT
      # ============================================================

      - name: Generate story and optimized Blender script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "================================"
          echo "PROJECT_DIBOO"
          echo "GEMINI 3.5 FLASH-LITE GENERATOR"
          echo "OPTIMIZED RENDER EDITION"
          echo "================================"

          mkdir -p blender_scene

          cat > request.json <<'JSON'
          {
            "model": "gemini-3.5-flash-lite",
            "input": "You are the story and optimized Blender procedural generation engine for Project_Diboo. Generate BOTH a structured story and a complete Blender Python script in ONE response. The story is for an original 3D cartoon YouTube Short. It must be highly visual and understandable without audio. Use simple objects, animals, vehicles, machines, or simple characters. Do not copy copyrighted characters, franchises, companies, or protected visual styles. Target approximately 50 seconds and remain between 40 and 60 seconds. Narration language must be English. Story structure: HOOK 0-5 seconds, SITUATION 5-12 seconds, PROBLEM 12-25 seconds, ACTION 25-40 seconds, RESOLUTION 40-50 seconds, PAYOFF 50-55 seconds. Create strong visual storytelling, clear cause and effect, simple camera movements, and simple SFX suggestions. Return ONLY valid JSON with exactly these top-level fields: story and blender_script. The story object MUST contain exactly: title, duration_target, language, hook, narration, scenes. duration_target MUST be a plain integer. language MUST be en. Every scene MUST contain: duration, description, camera, action, sfx. Scene duration MUST be a plain integer. The blender_script field MUST contain a complete standalone Python script for Blender 4.0.2. The Blender script must use bpy and generate the scene procedurally. It must create the environment, ground, story objects, simple characters when needed, materials, camera, lighting, and animation. Do not require external assets, addons, downloads, internet access, or external files. Use simple primitives such as cubes, spheres, cylinders, cones and planes. Use exactly scene.render.engine = 'BLENDER_EEVEE'. Configure vertical video at 1080x1920, resolution percentage 100, and 24 FPS. Convert story duration to frames and set scene.frame_start = 1 and scene.frame_end accordingly. Create an active camera and at least one light. The scene MUST be optimized for very fast Eevee rendering on a CPU-only/headless GitHub Actions runner. HARD COMPLEXITY LIMITS: maximum 24 mesh objects, maximum 3 lights, maximum 1 camera, maximum 24 total scene objects whenever possible. Prefer reusing the same objects instead of creating many duplicate objects. Do not use particle systems. Do not use fluid simulations. Do not use rigid body simulations. Do not use cloth simulations. Do not use smoke. Do not use fire. Do not use volumetric effects. Do not use geometry nodes. Do not use hair. Do not use grease pencil. Do not use Freestyle. Do not use subdivision modifiers. Do not use boolean-heavy geometry. Do not use displacement. Do not use complex shader node networks. Do not use image textures. Do not use external textures. Do not use HDRIs. Do not use depth of field. Do not use motion blur. Do not use screen space reflections. Do not use screen space refraction. Do not use ray tracing. Do not use compositing nodes. Do not create thousands of small objects. Do not create dense meshes. Use low segment primitives, normally 8 to 16 segments. Use simple Principled BSDF materials with solid colors. Use simple area, point, or sun lights. Keep animation simple: keyframe only the few important objects needed for the story. Avoid expensive per-frame Python handlers or drivers. Do not run bpy.ops.render.render from inside the generated script. The workflow will render the saved blend separately. The script MUST save the Blender file to /tmp/diboo_story_scene.blend. At the end print DIBOO BLENDER SCENE CREATED, STORY TITLE, TOTAL FRAMES, FPS, RESOLUTION and BLENDER SCENE READY. Return ONLY the JSON object. No Markdown. No code fences. No explanations."
          }
          JSON

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo ""
            echo "===== GEMINI FLASH-LITE ATTEMPT $ATTEMPT / 5 ====="

            RESPONSE=$(curl -s \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/interactions" \
              -d @request.json)

            echo "$RESPONSE" > gemini_response.json

            echo ""
            echo "===== GEMINI RESPONSE ====="
            cat gemini_response.json

            if echo "$RESPONSE" | grep -q '"error"'; then

              if echo "$RESPONSE" | grep -qE '"code": ?503|"status": ?"UNAVAILABLE"|service_unavailable'; then
                echo ""
                echo "Gemini Flash-Lite temporarily unavailable."
                echo "Waiting 20 seconds before retry..."
                sleep 20
                continue
              fi

              if echo "$RESPONSE" | grep -qE '"code": ?429|too_many_requests|Rate limit exceeded'; then
                echo ""
                echo "Gemini Flash-Lite rate limit reached."
                echo "Waiting 60 seconds before retry..."
                sleep 60
                continue
              fi

              echo ""
              echo "===== GEMINI API ERROR ====="
              exit 1
            fi

            SUCCESS=true
            break
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "===== GEMINI FLASH-LITE FAILED AFTER 5 ATTEMPTS ====="
            exit 1
          fi

          echo ""
          echo "===== GEMINI FLASH-LITE RESPONSE RECEIVED ====="


      # ============================================================
      # 2. EXTRACT STORY + BLENDER SCRIPT
      # ============================================================

      - name: Extract generated Project_Diboo files
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open(
              "gemini_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              response = json.load(f)

          print("")
          print("================================")
          print("EXTRACTING PROJECT_DIBOO OUTPUT")
          print("================================")

          output_text = None

          for step in response.get("steps", []):

              if step.get("type") != "model_output":
                  continue

              for content in step.get("content", []):

                  if content.get("type") == "text":

                      text = content.get(
                          "text",
                          ""
                      ).strip()

                      if text:
                          output_text = text
                          break

              if output_text:
                  break

          if not output_text:

              print("")
              print("===== GEMINI RESPONSE STRUCTURE =====")

              print(
                  json.dumps(
                      response,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise RuntimeError(
                  "Gemini response did not contain output text."
              )

          if output_text.startswith("```json"):
              output_text = output_text[7:]

          elif output_text.startswith("```"):
              output_text = output_text[3:]

          if output_text.rstrip().endswith("```"):
              output_text = output_text.rstrip()[:-3]

          output_text = output_text.strip()

          try:
              generated = json.loads(output_text)

          except json.JSONDecodeError as error:

              print("")
              print("===== INVALID GEMINI JSON =====")
              print(output_text)

              raise RuntimeError(
                  f"Gemini did not return valid JSON: {error}"
              )

          if "story" not in generated:
              raise RuntimeError(
                  "Gemini output is missing story."
              )

          if "blender_script" not in generated:
              raise RuntimeError(
                  "Gemini output is missing blender_script."
              )

          story = generated["story"]
          blender_script = generated["blender_script"]

          if not isinstance(
              blender_script,
              str
          ):
              raise RuntimeError(
                  "blender_script must be a string."
              )

          blender_script = blender_script.strip()

          if blender_script.startswith("```python"):
              blender_script = blender_script[
                  len("```python"):
              ]

          elif blender_script.startswith("```"):
              blender_script = blender_script[3:]

          if blender_script.rstrip().endswith("```"):
              blender_script = (
                  blender_script.rstrip()[:-3]
              )

          blender_script = blender_script.strip()

          if not blender_script:
              raise RuntimeError(
                  "Generated Blender script is empty."
              )

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          Path(
              "blender_scene/blender_scene.py"
          ).write_text(
              blender_script,
              encoding="utf-8"
          )

          print("")
          print("===== STORY.JSON CREATED =====")

          print(
              json.dumps(
                  story,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("")
          print("===== BLENDER SCRIPT CREATED =====")
          print(
              "blender_scene/blender_scene.py"
          )

          print("")
          print("Script size:")
          print(
              len(blender_script),
              "characters"
          )
          PY


      # ============================================================
      # 3. VALIDATE PROJECT_DIBOO STORY
      # ============================================================

      - name: Validate Project_Diboo story
        run: |
          set -e

          python3 - <<'PY'
          import json
          import re

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          print("")
          print("================================")
          print("PROJECT_DIBOO STORY VALIDATION")
          print("================================")

          required_fields = [
              "title",
              "duration_target",
              "language",
              "hook",
              "narration",
              "scenes"
          ]

          for field in required_fields:

              if field not in story:
                  raise RuntimeError(
                      f"Missing required field: {field}"
                  )

          if story["language"].lower() != "en":
              raise RuntimeError(
                  "Story language must be English (en)."
              )

          raw_duration = story["duration_target"]

          if isinstance(raw_duration, bool):

              raise RuntimeError(
                  "duration_target cannot be boolean."
              )

          elif isinstance(raw_duration, int):

              duration = raw_duration

          elif isinstance(raw_duration, float):

              duration = int(raw_duration)

          elif isinstance(raw_duration, str):

              match = re.search(
                  r"\d+",
                  raw_duration
              )

              if not match:

                  raise RuntimeError(
                      "Could not extract duration."
                  )

              duration = int(
                  match.group(0)
              )

          else:

              raise RuntimeError(
                  "Unsupported duration_target format."
              )

          story["duration_target"] = duration

          if not 40 <= duration <= 60:

              raise RuntimeError(
                  f"Invalid duration: {duration}. "
                  "Must be between 40 and 60 seconds."
              )

          scenes = story["scenes"]

          if not isinstance(
              scenes,
              list
          ):

              raise RuntimeError(
                  "scenes must be a list."
              )

          if len(scenes) == 0:

              raise RuntimeError(
                  "No scenes were generated."
              )

          scene_fields = [
              "duration",
              "description",
              "camera",
              "action",
              "sfx"
          ]

          total_scene_duration = 0

          for index, scene in enumerate(
              scenes,
              start=1
          ):

              if not isinstance(
                  scene,
                  dict
              ):

                  raise RuntimeError(
                      f"Scene {index} is not an object."
                  )

              for field in scene_fields:

                  if field not in scene:

                      raise RuntimeError(
                          f"Scene {index} missing field: {field}"
                      )

              raw_scene_duration = scene["duration"]

              if isinstance(
                  raw_scene_duration,
                  bool
              ):

                  raise RuntimeError(
                      f"Scene {index} duration cannot be boolean."
                  )

              elif isinstance(
                  raw_scene_duration,
                  str
              ):

                  match = re.search(
                      r"\d+",
                      raw_scene_duration
                  )

                  if not match:

                      raise RuntimeError(
                          f"Scene {index} has invalid duration."
                      )

                  scene_duration = int(
                      match.group(0)
                  )

              elif isinstance(
                  raw_scene_duration,
                  (int, float)
              ):

                  scene_duration = int(
                      raw_scene_duration
                  )

              else:

                  raise RuntimeError(
                      f"Scene {index} duration must be numeric."
                  )

              if scene_duration <= 0:

                  raise RuntimeError(
                      f"Scene {index} duration must be positive."
                  )

              scene["duration"] = scene_duration

              total_scene_duration += scene_duration

          with open(
              "story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("================================")
          print("DIBOO STORY VALIDATION: PASSED")
          print("================================")

          print("")
          print("TITLE:")
          print(story["title"])

          print("")
          print("DURATION:")
          print(
              story["duration_target"],
              "seconds"
          )

          print("")
          print("LANGUAGE:")
          print(story["language"])

          print("")
          print("SCENES:")
          print(len(scenes))

          print("")
          print("TOTAL SCENE DURATION:")
          print(
              total_scene_duration,
              "seconds"
          )

          print("")
          print("story.json is valid.")
          PY


      # ============================================================
      # 4. VALIDATE BLENDER PYTHON SCRIPT
      # ============================================================

      - name: Validate Blender Python script
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCRIPT VALIDATION"
          echo "================================"

          test -s \
            blender_scene/blender_scene.py

          python3 -m py_compile \
            blender_scene/blender_scene.py

          echo ""
          echo "Blender Python syntax:"
          echo "PASSED"

          echo ""
          echo "Script:"
          ls -lh \
            blender_scene/blender_scene.py

          echo ""
          echo "================================"
          echo "DIBOO BLENDER SCRIPT: PASSED"
          echo "================================"


      # ============================================================
      # 5. INSTALL BLENDER
      # ============================================================

      - name: Install Blender
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER INSTALLATION"
          echo "================================"

          if command -v blender >/dev/null 2>&1; then

            echo ""
            echo "Blender already installed:"
            blender --version

          else

            echo ""
            echo "Installing Blender..."

            sudo apt-get update

            sudo apt-get install -y \
              blender \
              libtbb12 \
              libegl1 \
              libgl1 \
              libglib2.0-0

            echo ""
            echo "Blender installation completed."

            blender --version

          fi


      # ============================================================
      # 6. GENERATE + OPTIMIZE BLENDER SCENE
      # ============================================================

      - name: Generate and optimize Blender scene
        run: |
          set -e

          echo "================================"
          echo "DIBOO BLENDER SCENE GENERATOR"
          echo "OPTIMIZED EEVEE SETTINGS"
          echo "================================"

          blender \
            -b \
            --python blender_scene/blender_scene.py

          if [ ! -f /tmp/diboo_story_scene.blend ]; then

            echo ""
            echo "ERROR:"
            echo "/tmp/diboo_story_scene.blend was not created."

            exit 1

          fi

          echo ""
          echo "================================"
          echo "DIBOO BLENDER SCENE CREATED"
          echo "================================"

          cat > /tmp/optimize_scene.py <<'PY'
          import bpy

          print("")
          print("================================")
          print("DIBOO BLENDER OPTIMIZATION")
          print("================================")

          scene = bpy.context.scene

          # --------------------------------------------------------
          # RENDER FORMAT
          # --------------------------------------------------------

          scene.render.engine = 'BLENDER_EEVEE'

          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100

          scene.render.fps = 24
          scene.render.fps_base = 1.0

          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_mode = 'RGB'
          scene.render.image_settings.color_depth = '8'

          scene.render.film_transparent = False

          scene.render.use_file_extension = True

          scene.render.use_freestyle = False
          scene.render.use_compositing = False

          # --------------------------------------------------------
          # BLENDER SIMPLIFICATION
          # --------------------------------------------------------

          if hasattr(scene.render, "use_simplify"):
              scene.render.use_simplify = True

          if hasattr(
              scene.render,
              "simplify_subdivision_render"
          ):
              scene.render.simplify_subdivision_render = 0

          if hasattr(
              scene.render,
              "simplify_subdivision"
          ):
              scene.render.simplify_subdivision = 0

          if hasattr(
              scene.render,
              "simplify_volumes"
          ):
              scene.render.simplify_volumes = 0.25

          # --------------------------------------------------------
          # EEVEE OPTIMIZATION
          # --------------------------------------------------------

          eevee = scene.eevee

          if hasattr(
              eevee,
              "taa_render_samples"
          ):
              eevee.taa_render_samples = 8

          if hasattr(
              eevee,
              "taa_samples"
          ):
              eevee.taa_samples = 4

          if hasattr(
              eevee,
              "use_raytracing"
          ):
              eevee.use_raytracing = False

          if hasattr(
              eevee,
              "use_volumetric_shadows"
          ):
              eevee.use_volumetric_shadows = False

          if hasattr(
              eevee,
              "use_bokeh_jittered"
          ):
              eevee.use_bokeh_jittered = False

          if hasattr(
              eevee,
              "use_overscan"
          ):
              eevee.use_overscan = False

          if hasattr(
              eevee,
              "shadow_resolution_scale"
          ):
              eevee.shadow_resolution_scale = 0.5

          if hasattr(
              eevee,
              "shadow_ray_count"
          ):
              eevee.shadow_ray_count = 1

          if hasattr(
              eevee,
              "shadow_step_count"
          ):
              eevee.shadow_step_count = 4

          # --------------------------------------------------------
          # DISABLE EXPENSIVE OBJECT FEATURES
          # --------------------------------------------------------

          modifier_count = 0

          for obj in scene.objects:

              if obj.type == 'MESH':

                  for modifier in obj.modifiers:

                      modifier_count += 1

                      try:
                          modifier.show_render = False
                      except:
                          pass

              if obj.type == 'LIGHT':

                  if hasattr(
                      obj.data,
                      "use_shadow"
                  ):
                      obj.data.use_shadow = True

          # --------------------------------------------------------
          # RENDER THREADS
          # --------------------------------------------------------

          scene.render.threads_mode = 'AUTO'

          # --------------------------------------------------------
          # LOCK INTERFACE WHEN AVAILABLE
          # --------------------------------------------------------

          if hasattr(
              scene.render,
              "use_lock_interface"
          ):
              scene.render.use_lock_interface = True

          # --------------------------------------------------------
          # FRAME INFORMATION
          # --------------------------------------------------------

          total_frames = (
              scene.frame_end
              - scene.frame_start
              + 1
          )

          # --------------------------------------------------------
          # SCENE STATISTICS
          # --------------------------------------------------------

          mesh_objects = [
              obj
              for obj in scene.objects
              if obj.type == 'MESH'
          ]

          lights = [
              obj
              for obj in scene.objects
              if obj.type == 'LIGHT'
          ]

          cameras = [
              obj
              for obj in scene.objects
              if obj.type == 'CAMERA'
          ]

          print("")
          print("OBJECT STATISTICS")
          print("--------------------------------")
          print(
              "Total objects:",
              len(scene.objects)
          )
          print(
              "Mesh objects:",
              len(mesh_objects)
          )
          print(
              "Lights:",
              len(lights)
          )
          print(
              "Cameras:",
              len(cameras)
          )
          print(
              "Modifiers:",
              modifier_count
          )

          print("")
          print("ANIMATION")
          print("--------------------------------")
          print(
              "Frame start:",
              scene.frame_start
          )
          print(
              "Frame end:",
              scene.frame_end
          )
          print(
              "Total frames:",
              total_frames
          )
          print(
              "FPS:",
              scene.render.fps
          )

          print("")
          print("RESOLUTION")
          print("--------------------------------")
          print(
              scene.render.resolution_x,
              "x",
              scene.render.resolution_y
          )

          print("")
          print("EEVEE RENDER SAMPLES")
          print("--------------------------------")

          if hasattr(
              eevee,
              "taa_render_samples"
          ):
              print(
                  "Render samples:",
                  eevee.taa_render_samples
              )

          print("")
          print("================================")
          print("DIBOO BLENDER OPTIMIZATION DONE")
          print("================================")

          bpy.ops.wm.save_as_mainfile(
              filepath="/tmp/diboo_story_scene.blend"
          )

          print("")
          print("Optimized blend saved.")
          PY

          blender \
            -b /tmp/diboo_story_scene.blend \
            --python /tmp/optimize_scene.py

          echo ""
          echo "================================"
          echo "DIBOO OPTIMIZED BLEND READY"
          echo "================================"

          ls -lh \
            /tmp/diboo_story_scene.blend


      # ============================================================
      # 7. BENCHMARK 24 FRAMES
      # ============================================================

      - name: Benchmark Blender render
        run: |
          set -e
          set -o pipefail

          echo "================================"
          echo "DIBOO BLENDER PERFORMANCE TEST"
          echo "================================"

          mkdir -p /tmp/diboo_benchmark

          FRAME_START=1
          FRAME_END=24

          echo ""
          echo "Benchmark frames:"
          echo "$FRAME_START -> $FRAME_END"

          echo ""
          echo "Starting 24-frame benchmark..."

          /usr/bin/time \
            -f "%e" \
            -o benchmark_seconds.txt \
            blender \
              -b \
              /tmp/diboo_story_scene.blend \
              -s $FRAME_START \
              -e $FRAME_END \
              -o /tmp/diboo_benchmark/frame_ \
              -F PNG \
              -x 1 \
              -a \
            2>&1 | tee benchmark.log

          BENCHMARK_SECONDS=$(cat benchmark_seconds.txt)

          echo ""
          echo "Benchmark seconds:"
          echo "$BENCHMARK_SECONDS"

          python3 - <<'PY'
          import json
          import math

          with open(
              "story.json",
              "r",
              encoding="utf-8"
          ) as f:
              story = json.load(f)

          duration = int(
              story["duration_target"]
          )

          fps = 24

          total_frames = (
              duration * fps
          )

          benchmark_frames = 24

          with open(
              "benchmark_seconds.txt",
              "r",
              encoding="utf-8"
          ) as f:
              benchmark_seconds = float(
                  f.read().strip()
              )

          estimated_seconds = (
              benchmark_seconds
              * total_frames
              / benchmark_frames
          )

          estimated_minutes = (
              estimated_seconds
              / 60
          )

          print("")
          print("================================")
          print("DIBOO RENDER BENCHMARK RESULT")
          print("================================")

          print("")
          print("Story duration:")
          print(
              duration,
              "seconds"
          )

          print("")
          print("Estimated total frames:")
          print(
              total_frames
          )

          print("")
          print("Benchmark frames:")
          print(
              benchmark_frames
          )

          print("")
          print("Benchmark time:")
          print(
              round(
                  benchmark_seconds,
                  2
              ),
              "seconds"
          )

          print("")
          print("ESTIMATED FULL RENDER:")
          print(
              round(
                  estimated_minutes,
                  2
              ),
              "minutes"
          )

          print("================================")

          with open(
              "render_estimate.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  {
                      "duration_seconds": duration,
                      "fps": fps,
                      "total_frames": total_frames,
                      "benchmark_frames": benchmark_frames,
                      "benchmark_seconds": benchmark_seconds,
                      "estimated_full_render_seconds": estimated_seconds,
                      "estimated_full_render_minutes": estimated_minutes
                  },
                  f,
                  indent=2
              )
          PY


      # ============================================================
      # 8. STOP IF RENDER IS STILL TOO SLOW
      # ============================================================

      - name: Check optimized render target
        run: |
          set -e

          echo "================================"
          echo "DIBOO RENDER TARGET CHECK"
          echo "================================"

          ESTIMATED_MINUTES=$(python3 - <<'PY'
          import json

          with open(
              "render_estimate.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              data[
                  "estimated_full_render_minutes"
              ]
          )
          PY
          )

          echo ""
          echo "Estimated full render:"
          echo "$ESTIMATED_MINUTES minutes"

          MAX_MINUTES=75

          echo ""
          echo "Maximum accepted target:"
          echo "$MAX_MINUTES minutes"

          python3 - <<PY
          estimated = float("$ESTIMATED_MINUTES")
          maximum = float("$MAX_MINUTES")

          if estimated > maximum:
              print("")
              print("================================")
              print("DIBOO RENDER STILL TOO SLOW")
              print("================================")
              print("")
              print(
                  f"Estimated render: {estimated:.2f} minutes"
              )
              print(
                  f"Target limit: {maximum:.2f} minutes"
              )
              print("")
              print(
                  "The full animation was NOT rendered."
              )
              print(
                  "This prevents another multi-hour test."
              )
              raise SystemExit(1)

          print("")
          print("================================")
          print("DIBOO RENDER TARGET ACCEPTED")
          print("================================")
          print("")
          print(
              f"Estimated render: {estimated:.2f} minutes"
          )
          PY


      # ============================================================
      # 9. RENDER COMPLETE ANIMATION
      # ============================================================

      - name: Render complete Blender animation
        run: |
          set -e
          set -o pipefail

          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER"
          echo "================================"

          mkdir -p /tmp/diboo_render

          echo ""
          echo "Starting optimized full animation render..."

          blender \
            -b \
            /tmp/diboo_story_scene.blend \
            -o /tmp/diboo_render/frame_ \
            -F PNG \
            -x 1 \
            -a \
            2>&1 | tee full_render.log

          echo ""
          echo "================================"
          echo "DIBOO FULL ANIMATION RENDER FINISHED"
          echo "================================"

          ls -lh /tmp/diboo_render | head -20


      # ============================================================
      # 10. VERIFY COMPLETE ANIMATION RENDER
      # ============================================================

      - name: Verify complete animation render
        run: |
          set -e

          echo "================================"
          echo "DIBOO FULL RENDER VERIFICATION"
          echo "================================"

          EXPECTED_FRAMES=$(python3 - <<'PY'
          import json

          with open(
              "render_estimate.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              data["total_frames"]
          )
          PY
          )

          ACTUAL_FRAMES=$(find \
            /tmp/diboo_render \
            -type f \
            -name "*.png" \
            | wc -l)

          echo ""
          echo "EXPECTED PNG FRAMES:"
          echo "$EXPECTED_FRAMES"

          echo ""
          echo "ACTUAL PNG FRAMES:"
          echo "$ACTUAL_FRAMES"

          if [ "$ACTUAL_FRAMES" -lt "$EXPECTED_FRAMES" ]; then

            echo ""
            echo "ERROR:"
            echo "Full animation render is incomplete."

            exit 1

          fi

          echo ""
          echo "================================"
          echo "DIBOO FULL RENDER: PASSED"
          echo "================================"

          echo ""
          echo "Animation frames:"
          echo "$ACTUAL_FRAMES"

          echo ""
          echo "Render directory:"
          du -sh /tmp/diboo_render

          echo ""
          echo "================================"
          echo "PROJECT_DIBOO STEP COMPLETE"
          echo "================================"
